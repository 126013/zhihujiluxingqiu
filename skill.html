<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的星球 · 星愈</title>
  <link rel="stylesheet" href="css/style.css?v=100">
  <style>
    :root {
      --ink: #eafcff;
      --muted: #8eb8c3;
      --cyan: #7cecff;
      --deep: #02090d;
      --card-w: clamp(200px, 20vw, 320px);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: #010304;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    .page-placeholder {
      min-height: 38vh;
      display: grid;
      place-items: center;
      padding: 64px 6vw;
      background: radial-gradient(circle at 50% 70%, rgba(18, 83, 99, .18), transparent 52%);
      text-align: center;
    }
    .page-placeholder h1,
    .page-placeholder p { margin: 0; }
    .page-placeholder h1 {
      font-size: clamp(28px, 4vw, 54px);
      letter-spacing: .12em;
      font-weight: 500;
    }
    .page-placeholder p {
      margin-top: 16px;
      color: var(--muted);
      letter-spacing: .12em;
    }

    .orbit-section {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 86%, rgba(7, 133, 162, .22), transparent 42%),
        linear-gradient(180deg, #010304 0%, #02090d 72%, #06161b 100%);
    }
    .orbit-section::after {
      content: "";
      position: absolute;
      inset: 72% -15% -12%;
      background: radial-gradient(ellipse, rgba(87, 222, 245, .16), transparent 66%);
      filter: blur(26px);
      pointer-events: none;
    }

    .scene {
      position: relative;
      width: min(1280px, 96vw);
      height: clamp(560px, 82vh, 760px);
      perspective: 1200px;
      user-select: none;
      touch-action: pan-y;
    }
    .scene__hint {
      position: absolute;
      left: 50%;
      bottom: 1.5%;
      transform: translateX(-50%);
      color: rgba(190, 241, 249, .62);
      font-size: 13px;
      letter-spacing: .16em;
      white-space: nowrap;
      z-index: 120;
      pointer-events: none;
    }

    .sphere {
      position: absolute;
      border-radius: 50%;
      pointer-events: auto;
      cursor: pointer;
      border: 0;
      padding: 0;
    }
    .sphere--rear {
      /* The rear planet keeps its existing top anchor, while its diameter
         is capped so the complete planet remains visible in the hero. */
      width: min(48vw, 610px, 58vh);
      aspect-ratio: 1;
      left: 50%;
      top: 7%;
      transform: translateX(-33%);
      z-index: 4;
      background:
        radial-gradient(circle at 32% 27%, rgba(190, 234, 246, .3), transparent 25%),
        radial-gradient(circle at 45% 42%, #142b38 0%, #07121d 44%, #02050c 75%);
      box-shadow:
        0 0 20px rgba(166, 226, 242, .84),
        0 0 88px rgba(50, 168, 201, .24),
        inset -40px -18px 75px rgba(0, 0, 0, .86);
      transition: filter .25s ease, transform .25s ease;
    }
    .sphere--rear:hover,
    .sphere--rear:focus-visible {
      filter: brightness(1.35);
      transform: translateX(-33%) scale(1.015);
      outline: none;
    }
    .sphere--rear::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 18px 12px 20px rgba(230, 251, 255, .15), inset -40px -20px 55px rgba(0, 0, 0, .8);
    }
    .sphere__label {
      position: absolute;
      right: 12%;
      top: 18%;
      z-index: 2;
      color: #d9fbff;
      font-size: clamp(14px, 1.4vw, 22px);
      letter-spacing: .18em;
      text-shadow: 0 0 16px #9ceeff;
      writing-mode: vertical-rl;
    }

    .sphere--main {
      /* Exactly the same diameter and top anchor as the rear sphere. */
      width: min(48vw, 610px, 58vh);
      aspect-ratio: 1;
      left: 50%;
      top: 7%;
      transform: translateX(-50%);
      z-index: 38;
      --planet-light: rgba(212, 250, 255, .92);
      --planet-bright: rgb(29, 214, 241);
      --planet-mid: rgb(8, 126, 155);
      --planet-dark: rgb(3, 39, 52);
      --planet-glow: rgba(1, 101, 129, .85);
      --planet-tint: rgba(18, 203, 229, .72);
      background:
        radial-gradient(circle at 29% 25%, rgba(255, 255, 255, .98) 0 5%, var(--planet-light) 19%, transparent 43%),
        radial-gradient(circle at 66% 58%, var(--planet-bright), var(--planet-mid) 52%, var(--planet-dark) 82%);
      box-shadow:
        -24px -16px 45px rgba(255, 255, 255, .7),
        24px 22px 70px var(--planet-glow),
        inset -36px -28px 52px rgba(0, 24, 34, .5);
      overflow: hidden;
      cursor: pointer;
      transition: filter .25s ease;
    }
    .sphere--main::before {
      content: "";
      position: absolute;
      inset: -6%;
      border-radius: inherit;
      opacity: .72;
      background:
        radial-gradient(ellipse at 35% 32%, rgba(255,255,255,.55), transparent 7%),
        radial-gradient(ellipse at 59% 42%, rgba(255,255,255,.2), transparent 13%),
        radial-gradient(ellipse at 43% 69%, rgba(4, 91, 113, .62), transparent 20%),
        repeating-radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.11) 0 2px, transparent 3px 12px);
      mix-blend-mode: screen;
      filter: blur(2px);
    }
    .sphere__color-layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 1;
      mix-blend-mode: color;
      pointer-events: none;
    }
    .sphere__color-layer--current {
      opacity: .78;
    }
    .sphere__color-layer--next {
      opacity: 0;
      will-change: opacity, mask-position;
      -webkit-mask-image: linear-gradient(135deg, transparent 0%, transparent 20%, #000 80%, #000 100%);
      mask-image: linear-gradient(135deg, transparent 0%, transparent 20%, #000 80%, #000 100%);
      -webkit-mask-size: 240% 240%;
      mask-size: 240% 240%;
      -webkit-mask-position: 100% 100%;
      mask-position: 100% 100%;
    }
    .sphere__color-layer--next.is-wiping {
      opacity: .78;
      animation: diagonal-gradient 2s cubic-bezier(.2,.8,.25,1) forwards;
    }
    .sphere--main::before { z-index: 3; }
    .sphere--main:hover,
    .sphere--main:focus-visible { filter: brightness(1.08); outline: none; }
    .sphere--main::after {
      content: "";
      position: absolute;
      inset: -7%;
      border-radius: inherit;
      border: 2px solid rgba(225, 253, 255, .75);
      opacity: 0;
      pointer-events: none;
    }
    @keyframes diagonal-gradient {
      0% { opacity: .82; -webkit-mask-position: 100% 100%; mask-position: 100% 100%; }
      72% { opacity: .42; }
      100% { opacity: 0; -webkit-mask-position: 0% 0%; mask-position: 0% 0%; }
    }

    .orbit {
      position: absolute;
      inset: 0;
      /* Keep the orbit itself out of a stacking context so individual cards
         can pass behind or in front of the two spheres. */
      z-index: auto;
      cursor: grab;
      touch-action: none;
    }
    .orbit.is-dragging { cursor: grabbing; }

    .card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--card-w);
      aspect-ratio: .86;
      transform-origin: center center;
      border: 1px solid rgba(228, 253, 255, .9);
      border-radius: 22px;
      color: #e8fcff;
      background: linear-gradient(145deg, rgba(172, 248, 255, .64), rgba(16, 138, 165, .36) 58%, rgba(7, 47, 65, .38));
      box-shadow:
        0 0 12px rgba(177, 246, 255, .88),
        0 0 36px rgba(77, 212, 237, .32),
        inset 0 0 22px rgba(226, 255, 255, .19);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      text-align: center;
      transition: filter .3s ease, border-color .3s ease, box-shadow .3s ease;
      will-change: transform, opacity;
      cursor: pointer;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-left: 1px solid rgba(236, 255, 255, .62);
      border-radius: 8px;
      pointer-events: none;
    }
    .card__title { position: relative; z-index: 1; }
    .card__title {
      font-size: clamp(18px, 2.2vw, 28px);
      letter-spacing: .12em;
      line-height: 1.3;
      text-shadow: 0 0 16px rgba(209, 252, 255, .88);
      font-weight: 500;
    }
    .card.is-active {
      border-color: #fff;
      box-shadow:
        0 0 12px rgba(236, 255, 255, 1),
        0 0 42px rgba(85, 224, 245, .75),
        inset 0 0 23px rgba(245, 255, 255, .33);
      filter: brightness(1.2);
    }
    .card.is-selected {
      translate: 0 -8px;
      scale: 1.06;
      border-color: #ffffff;
      box-shadow: 0 0 16px rgba(255,255,255,1), 0 0 46px rgba(85,224,245,.95), inset 0 0 24px rgba(245,255,255,.38);
      filter: brightness(1.3) saturate(1.15);
    }
    .card:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      z-index: 300;
      transform: translate(-50%, 20px);
      padding: 12px 22px;
      border: 1px solid rgba(190, 249, 255, .62);
      border-radius: 999px;
      color: #ebfeff;
      background: rgba(2, 25, 32, .84);
      box-shadow: 0 0 28px rgba(86, 226, 248, .34);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
      letter-spacing: .08em;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-height: 760px) {
      :root { --card-w: clamp(148px, 14.6vw, 204px); }
      .scene { height: calc(100vh - 28px); min-height: 520px; }
      .sphere--main { top: 7%; width: min(48vw, 610px, 58vh); }
      .sphere--rear { top: 7%; width: min(48vw, 610px, 58vh); }
      .scene__hint { bottom: .8%; }
    }
    @media (max-width: 760px) {
      :root { --card-w: clamp(136px, 36vw, 192px); }
      body { min-width: 0; }
      .page-placeholder { min-height: 26vh; padding: 40px 8vw; }
      .orbit-section { min-height: 86vh; }
      .scene { width: 100vw; height: 650px; min-height: 0; }
      .sphere--rear,
      .sphere--main { width: min(72vw, 410px, 55vh); }
      .sphere--rear,
      .sphere--main { top: 7%; }
      .sphere__label { right: 8%; font-size: 14px; }
      .scene__hint { bottom: 2%; font-size: 11px; letter-spacing: .08em; }
    }
  </style>
</head>
<body>
  <section class="page-placeholder">
    <div>
      <h1>选择你的星球</h1>
      <p>探索七大方向 · 点击星球进入</p>
    </div>
  </section>

  <main class="orbit-section" aria-label="星球环绕导航">
    <div class="scene">
      <button class="sphere sphere--rear" type="button" aria-label="进入双盲棱镜">
        <span class="sphere__label">双盲棱镜</span>
      </button>
      <button class="sphere sphere--main" type="button" aria-label="进入当前选中的星球">
        <span class="sphere__color-layer sphere__color-layer--current" aria-hidden="true"></span>
        <span class="sphere__color-layer sphere__color-layer--next" aria-hidden="true"></span>
      </button>
      <div class="orbit" aria-label="星球卡片列表"></div>
      <p class="scene__hint">拖动、滚轮或滑动来探索更多星球</p>
    </div>
  </main>

  <section class="page-placeholder">
    <div>
      <p>拖动、滚轮或滑动来探索</p>
    </div>
  </section>

  <div class="toast" role="status" aria-live="polite"></div>

  <!-- 星愈站点顶部导航 -->
  <script src="js/store.js?v=100"></script>
  <script src="js/app.js?v=100"></script>
  <script>
    if (window.StarhealApp) StarhealApp.injectTopNav();
    document.body.style.paddingTop = '70px';
  </script>

  <script>
    (() => {
      const skills = [
        { title: "爱好星球", sub: "萌宠·游戏·二次元·影视综·音乐·读书·运动·手工", theme: "violet", topic: "hobby" },
        { title: "成长星球", sub: "校园·考试·语言·编程·技能·自律打卡",           theme: "green",  topic: "growth" },
        { title: "情绪星球", sub: "树洞·治愈·失恋·独居·关系·心理·玄学",           theme: "rose",   topic: "emotion" },
        { title: "生活星球", sub: "穿搭·家居·旅行·省钱·养生",                     theme: "warm",   topic: "life" },
        { title: "职场星球", sub: "求职·打工人·副业·职业·创业",                   theme: "gold",   topic: "career" },
        { title: "身份星球", sub: "同城·校友·同龄·留学生·老乡",                   theme: "blue",   topic: "identity" },
        { title: "潮流星球", sub: "饭圈·吃瓜·数码·梗文化·亚文化",                 theme: "violet", topic: "trend" }
      ];

      const orbit = document.querySelector(".orbit");
      const mainSphere = document.querySelector(".sphere--main");
      const currentLayer = mainSphere.querySelector(".sphere__color-layer--current");
      const nextLayer = mainSphere.querySelector(".sphere__color-layer--next");
      const rearSphere = document.querySelector(".sphere--rear");
      const toast = document.querySelector(".toast");
      const section = document.querySelector(".orbit-section");
      const cards = skills.map((s, index) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.dataset.index = index;
        card.dataset.id = `card-${String(index + 1).padStart(2, "0")}`;
        card.setAttribute("aria-label", s.title);
        card.innerHTML = `<span class="card__title">${s.title}</span>`;
        card.addEventListener("click", (event) => {
          event.stopPropagation();
          if (pointerSelected) { pointerSelected = false; return; }
          if (moved) return;
          // 选中 + 直接跳转
          selectCard(index);
          const s2 = skills[index];
          showToast(`正在进入：${s2.title}`);
          setTimeout(() => { location.href = `home.html?topic=${s2.topic}`; }, 700);
        });
        orbit.appendChild(card);
        return card;
      });

      const count = cards.length;
      const step = 360 / count;
      let rotation = 0;
      let velocity = 0;
      let lastTime = performance.now();
      let dragging = false;
      let moved = false;
      let lastX = 0;
      let startX = 0;
      let pressedCardIndex = null;
      let pointerSelected = false;
      let sectionVisible = false;
      let selectionPaused = false;
      let transitionLock = false;
      let snap = null;
      let toastTimer;
      let selectedIndex = 0;

      const themeByTag = {
        "灵感": "violet", "创作": "violet", "陪伴": "warm", "生活": "green",
        "探索": "gold", "聆听": "violet", "知识": "blue", "视觉": "rose",
        "表达": "rose", "成长": "green", "效率": "blue", "健康": "red",
        "日常": "warm", "观察": "blue", "娱乐": "violet", "工具": "blue"
      };
      const themePalette = {
        warm:   { light: "rgba(255,231,198,.9)", bright: "#ffb45c", mid: "#c95a37", dark: "#34131b", glow: "rgba(194,77,51,.9)", tint: "rgba(255,126,72,.76)" },
        green:  { light: "rgba(225,255,210,.9)", bright: "#85ef9d", mid: "#208c78", dark: "#082e2b", glow: "rgba(24,157,122,.9)", tint: "rgba(54,220,125,.76)" },
        gold:   { light: "rgba(255,248,205,.9)", bright: "#ffd86b", mid: "#c28b32", dark: "#3b230d", glow: "rgba(210,152,34,.9)", tint: "rgba(255,194,59,.76)" },
        violet: { light: "rgba(238,218,255,.9)", bright: "#d58dff", mid: "#6845b5", dark: "#190d38", glow: "rgba(137,78,209,.9)", tint: "rgba(177,92,255,.76)" },
        blue:   { light: "rgba(215,242,255,.9)", bright: "#55c8ff", mid: "#2762bb", dark: "#0b173e", glow: "rgba(33,115,215,.9)", tint: "rgba(57,157,255,.76)" },
        rose:   { light: "rgba(255,220,244,.9)", bright: "#ff8bd8", mid: "#b544a3", dark: "#3d123b", glow: "rgba(205,65,165,.9)", tint: "rgba(255,83,193,.76)" },
        red:    { light: "rgba(255,228,215,.9)", bright: "#ff8068", mid: "#c53e42", dark: "#3e101b", glow: "rgba(216,56,54,.9)", tint: "rgba(255,78,77,.76)" }
      };
      const planetGradient = (palette) => [
        `radial-gradient(circle at 29% 25%, rgba(255,255,255,.98) 0 5%, ${palette.light} 19%, transparent 43%)`,
        `radial-gradient(circle at 66% 58%, ${palette.bright}, ${palette.mid} 52%, ${palette.dark} 82%)`
      ].join(", ");
      const applyThemeStyles = (theme, layer = currentLayer) => {
        const palette = themePalette[theme] || themePalette.blue;
        mainSphere.dataset.theme = theme;
        layer.style.background = planetGradient(palette);
      };
      applyThemeStyles("blue");

      const normalize = (angle) => ((angle + 180) % 360 + 360) % 360 - 180;
      const notifyNavigation = (payload) => {
        window.orbitSkillNavigate?.(payload);
      };
      const showToast = (message) => {
        toast.textContent = message;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 1600);
      };

      function layout() {
        const width = orbit.clientWidth;
        const height = orbit.clientHeight;
          const rx = Math.min(width * .48, 640);
          const ry = Math.min(height * .22, 160);
        let activeIndex = 0;
        let smallest = Infinity;

        cards.forEach((card, index) => {
          const angle = index * step + rotation;
          const rad = angle * Math.PI / 180;
          const frontness = Math.cos(rad);
          const x = Math.sin(rad) * rx;
          // Keep the front card near the lower centre while preserving enough
          // room for the full card, its glow and the instruction underneath.
          const y = Math.cos(rad) * ry + height * .145;
          const depth = (frontness + 1) / 2;
          const scale = .62 + depth * .48;
          const opacity = .23 + depth * .77;
          const blur = depth < .38 ? (1 - depth) * 1.2 : 0;
          const z = Math.round(frontness * 50 + 55);
          card.style.transform = `translate3d(calc(-50% + ${x}px), calc(-50% + ${y}px), 0) scale(${scale})`;
          card.style.opacity = opacity.toFixed(3);
          card.style.filter = `brightness(${(.68 + depth * .56).toFixed(2)}) blur(${blur.toFixed(2)}px)`;
          card.style.zIndex = z;
          const distance = Math.abs(normalize(angle));
          if (distance < smallest) {
            smallest = distance;
            activeIndex = index;
          }
        });

        cards.forEach((card, index) => card.classList.toggle("is-active", index === activeIndex));
      }

      function beginSnap(index, afterSnap) {
        const angle = index * step + rotation;
        const targetRotation = rotation - normalize(angle);
        snap = {
          from: rotation,
          to: targetRotation,
          start: performance.now(),
          duration: 520,
          after: afterSnap
        };
        velocity = 0;
      }

      function finishInertia() {
        let active = 0;
        let smallest = Infinity;
        cards.forEach((_, index) => {
          const distance = Math.abs(normalize(index * step + rotation));
          if (distance < smallest) { smallest = distance; active = index; }
        });
        beginSnap(active);
      }

      function selectCard(index) {
        if (transitionLock) return;
        transitionLock = true;
        cards.forEach((card, cardIndex) => card.classList.toggle("is-selected", cardIndex === index));
        selectionPaused = false;
        const applyPlanet = () => {
          const s = skills[index];
          selectedIndex = index;
          const theme = s.theme;
          const palette = themePalette[theme] || themePalette.blue;
          applyThemeStyles(theme);
          currentLayer.style.background = planetGradient(palette);
          nextLayer.style.background = [
            "linear-gradient(135deg, rgba(255,255,255,.22), transparent 42%, rgba(255,255,255,.08))",
            planetGradient(palette)
          ].join(", ");
          nextLayer.style.opacity = "0";
          nextLayer.style.webkitMaskImage = "linear-gradient(135deg, transparent 0%, transparent 20%, #000 80%, #000 100%)";
          nextLayer.style.maskImage = "linear-gradient(135deg, transparent 0%, transparent 20%, #000 80%, #000 100%)";
          nextLayer.style.webkitMaskPosition = "100% 100%";
          nextLayer.style.maskPosition = "100% 100%";
          nextLayer.classList.remove("is-wiping");
          void nextLayer.offsetWidth;
          selectionPaused = true;
          velocity = 0;
          snap = null;
          nextLayer.classList.add("is-wiping");
          setTimeout(() => {
            mainSphere.dataset.theme = theme;
            nextLayer.classList.remove("is-wiping");
            nextLayer.style.opacity = "0";
            nextLayer.style.webkitMaskPosition = "100% 100%";
            nextLayer.style.maskPosition = "100% 100%";
            showToast(`已选择：${s.title} · 点击星球进入`);
          }, 2000);
          setTimeout(() => { transitionLock = false; }, 2100);
        };
        const active = Math.abs(normalize(index * step + rotation)) < 1.2;
        if (active) applyPlanet();
        else beginSnap(index, applyPlanet);
      }

      mainSphere.addEventListener("click", () => {
        if (transitionLock) return;
        const s = skills[selectedIndex];
        showToast(`正在进入：${s.title}`);
        setTimeout(() => {
          location.href = `home.html?topic=${s.topic}`;
        }, 800);
      });

      orbit.addEventListener("pointerdown", (event) => {
        dragging = true;
        selectionPaused = false;
        moved = false;
        const pressedCard = event.target.closest?.(".card");
        pressedCardIndex = pressedCard ? Number(pressedCard.dataset.index) : null;
        lastX = event.clientX;
        startX = event.clientX;
        orbit.classList.add("is-dragging");
        orbit.setPointerCapture(event.pointerId);
      });
      orbit.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        const delta = event.clientX - lastX;
        lastX = event.clientX;
        // Ignore tiny hand/mouse jitter so a card click still registers.
        if (Math.abs(event.clientX - startX) > 7) moved = true;
        rotation += delta * .34;
        velocity = delta * .045;
        snap = null;
      });
      const release = (event) => {
        if (!dragging) return;
        dragging = false;
        orbit.classList.remove("is-dragging");
        try { orbit.releasePointerCapture(event.pointerId); } catch {}
        const cardIndex = pressedCardIndex;
        pressedCardIndex = null;
        if (cardIndex !== null && !moved) {
          pointerSelected = true;
          selectCard(cardIndex);
          return;
        }
        if (Math.abs(velocity) < .035) finishInertia();
      };
      orbit.addEventListener("pointerup", release);
      orbit.addEventListener("pointercancel", release);
      orbit.addEventListener("wheel", (event) => {
        event.preventDefault();
        selectionPaused = false;
        const delta = Math.max(-80, Math.min(80, event.deltaY));
        rotation += delta * .13;
        velocity = delta * .012;
        snap = null;
        clearTimeout(orbit._wheelTimer);
        orbit._wheelTimer = setTimeout(finishInertia, 170);
      }, { passive: false });
      rearSphere.addEventListener("click", () => {
        showToast("即将进入：双盲棱镜");
        setTimeout(() => { location.href = "prism.html"; }, 600);
      });

      const visibilityObserver = new IntersectionObserver(([entry]) => {
        sectionVisible = entry.isIntersecting && entry.intersectionRatio >= .18;
      }, { threshold: [0, .18, .5] });
      visibilityObserver.observe(section);

      function frame(now) {
        const dt = Math.min(50, now - lastTime);
        lastTime = now;
        if (snap) {
          const progress = Math.min(1, (now - snap.start) / snap.duration);
          const eased = 1 - Math.pow(1 - progress, 3);
          rotation = snap.from + (snap.to - snap.from) * eased;
          if (progress >= 1) {
            const callback = snap.after;
            snap = null;
            callback?.();
          }
        } else if (!dragging) {
          if (Math.abs(velocity) > .01) {
            rotation += velocity * dt;
            velocity *= Math.pow(.001, dt / 1000);
          } else if (sectionVisible && !selectionPaused) {
            rotation += .008 * dt;
          }
        }
        layout();
        requestAnimationFrame(frame);
      }

      layout();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
