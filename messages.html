<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{var p=(location.pathname.split('/').pop()||'').toLowerCase();var l=p==='community.html'||p==='messages.html';document.documentElement.setAttribute('data-theme',l?(localStorage.getItem('starheal-theme')||'dark'):'dark')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070f">
  <title>消息 — 星愈·双盲棱镜</title>
  <link rel="stylesheet" href="css/style.css?v=302">
  <style>
    .page{padding-top:72px;padding-bottom:60px;max-width:860px;margin:0 auto}
    .msg-header{padding:20px 24px 0;margin-bottom:16px}
    .msg-header h1{font-size:22px;font-weight:600;letter-spacing:.06em;background:linear-gradient(135deg,#fff,#a8b8e8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
    .msg-header .sub{font-size:13px;color:var(--text-dim)}
    .tabs{display:flex;gap:8px;padding:0 24px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tabs::-webkit-scrollbar{display:none}
    .tabs .tab{flex-shrink:0;padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--glass-border);font-size:13px;color:var(--text-glow);cursor:pointer;transition:all .25s}
    .tabs .tab:hover{background:rgba(255,255,255,.08)}
    .tabs .tab.active{background:linear-gradient(90deg,rgba(107,91,149,.4),rgba(74,111,165,.4));border-color:transparent;color:#fff}
    .msg-list{padding:0 24px}
    .msg-item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;margin-bottom:8px;cursor:pointer;transition:all .25s;border:1px solid transparent}
    .msg-item:hover{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.05)}
    .msg-item .avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#6b5b95,#4a6fa5);display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
    .msg-item .avatar .dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:#ff6b6b;border:2px solid #07070f}
    .msg-item .body{flex:1;min-width:0}
    .msg-item .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .msg-item .name{font-size:15px;font-weight:500;color:var(--text-star)}
    .msg-item .time{font-size:12px;color:var(--text-faint);flex-shrink:0;margin-left:10px}
    .msg-item .preview{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-item .count{background:linear-gradient(135deg,#ff6b6b,#ee5a6f);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center;font-weight:600}
    .empty{padding:80px 24px;text-align:center;color:var(--text-dim)}
    .empty .ico{font-size:48px;opacity:.3;margin-bottom:16px}
    .empty .t{font-size:16px;margin-bottom:8px;color:var(--text-glow)}
    .empty .s{font-size:13px;color:var(--text-faint)}
  </style>
</head>
<body>
  <main class="page">
    <div class="msg-header">
      <h1>消息</h1>
      <div class="sub">与同频星客的互动与共鸣</div>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="all">全部</div>
      <div class="tab" data-tab="reply">回复</div>
      <div class="tab" data-tab="like">点赞</div>
      <div class="tab" data-tab="mention">@我</div>
      <div class="tab" data-tab="system">系统</div>
    </div>
    <div class="msg-list" id="msgList"></div>
  </main>

  <script src="js/store.js?v=100"></script>
  <script src="js/app.js?v=204"></script>
  <script>
    StarhealApp.injectBackground();
    StarhealApp.injectTopNav('messages');

    const messages = [
      {type:'reply', name:'星海漫游者', time:'10分钟前', preview:'「关于你说的职场困境，我也有类似的感受，其实可以尝试……」', unread:2, avatar:'🌊'},
      {type:'like', name:'匿名星客', time:'1小时前', preview:'赞了你的观点：不必追赶最近总觉，试着把自己抵达', unread:0, avatar:'✨'},
      {type:'mention', name:'书虫阿May', time:'3小时前', preview:'@你 推荐了一本治愈系的书，快来看看吧～', unread:1, avatar:'📚'},
      {type:'reply', name:'运动达人', time:'5小时前', preview:'回复了你的帖子：跑步膝盖疼的话，先检查一下跑姿……', unread:0, avatar:'🏃'},
      {type:'system', name:'系统通知', time:'昨天', preview:'你的帖子《最近总觉得自己被生活推着走》获得了 35 条匹配', unread:0, avatar:'🔔'},
      {type:'like', name:'毛孩子家长', time:'昨天', preview:'赞了你的观点：选宠物不是选商品，是选家人', unread:0, avatar:'🐾'},
      {type:'reply', name:'音乐发烧友', time:'2天前', preview:'关于深夜歌单，我再补充几首适合失眠时听的……', unread:0, avatar:'🎵'},
      {type:'mention', name:'二次元少女', time:'3天前', preview:'@你 一起去漫展吗？这次有你喜欢的嘉宾！', unread:0, avatar:'🎀'},
      {type:'system', name:'双盲棱镜', time:'3天前', preview:'本周同频匹配报告已生成，点击查看你的共鸣星图', unread:1, avatar:'🔮'}
    ];

    const typeColors={'reply':'#7ed4e6','like':'#f4b8c8','mention':'#c8a0f0','system':'#d8c080'};
    const typeNames={'reply':'回复','like':'点赞','mention':'@我','system':'系统'};

    function render(filter){
      const list=document.getElementById('msgList');
      const items=filter==='all'?messages:messages.filter(m=>m.type===filter);
      if(items.length===0){
        list.innerHTML='<div class="empty"><div class="ico">✧</div><div class="t">暂无消息</div><div class="s">有新的共鸣会在这里提醒你</div></div>';
        return;
      }
      list.innerHTML=items.map(m=>
        '<div class="msg-item glass">'+
          '<div class="avatar" style="background:linear-gradient(135deg,'+typeColors[m.type]+',rgba(80,60,120,.6))">'+m.avatar+(m.unread?'<span class="dot"></span>':'')+'</div>'+
          '<div class="body">'+
            '<div class="top"><span class="name">'+m.name+'</span><span class="time">'+m.time+'</span></div>'+
            '<div class="preview">'+m.preview+'</div>'+
          '</div>'+
          (m.unread?'<div class="count">'+m.unread+'</div>':'')+
        '</div>'
      ).join('');
      list.querySelectorAll('.msg-item').forEach(c=>c.onclick=function(){alert('聊天界面开发中…');});
    }

    document.querySelectorAll('.tabs .tab').forEach(t=>{
      t.onclick=function(){
        document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        render(this.dataset.tab);
      };
    });

    render('all');
  </script>
</body>
</html>
