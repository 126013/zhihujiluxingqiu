<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{var p=(location.pathname.split('/').pop()||'').toLowerCase();var l=p==='community.html'||p==='messages.html';document.documentElement.setAttribute('data-theme',l?(localStorage.getItem('starheal-theme')||'dark'):'dark')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 星愈·双盲棱镜</title>
  <link rel="stylesheet" href="css/style.css?v=302">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{background:#050818;font-family:'Noto Sans SC',-apple-system,sans-serif;color:#fff;position:relative}
    .stars-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
    .stars-bg .star{position:absolute;background:#fff;border-radius:50%;opacity:.6;animation:twinkle 3s infinite ease-in-out}
    @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
    .nebula{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35}
    .nebula.pink{width:500px;height:500px;background:radial-gradient(circle,#6a3a7a,transparent 70%);top:-100px;left:-150px;animation:floatN 20s infinite ease-in-out}
    .nebula.orange{width:600px;height:600px;background:radial-gradient(circle,#b6573a,transparent 70%);bottom:-200px;right:-200px;animation:floatN 25s infinite ease-in-out reverse}
    @keyframes floatN{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
    .login-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:42px;font-weight:400;letter-spacing:.08em;background:linear-gradient(135deg,#fff,#c8b8e8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
    .slogan{font-size:13px;color:rgba(255,255,255,.5);letter-spacing:.2em;margin-bottom:40px}
    .login-card{width:100%;max-width:380px;padding:36px 32px;border-radius:20px;background:linear-gradient(160deg,rgba(25,20,50,.85),rgba(15,12,35,.9));border:1px solid rgba(200,180,230,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(80,40,120,.3)}
    .tab-row{display:flex;gap:8px;margin-bottom:24px}
    .tab{flex:1;padding:10px;text-align:center;border-radius:10px;font-size:14px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .3s;background:rgba(255,255,255,.03);border:1px solid transparent}
    .tab.active{color:#fff;background:linear-gradient(135deg,rgba(107,91,149,.4),rgba(74,111,165,.4));border-color:rgba(255,255,255,.1)}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;letter-spacing:.05em}
    .field input{width:100%;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;transition:all .3s;font-family:inherit}
    .field input:focus{border-color:rgba(168,216,234,.5);background:rgba(255,255,255,.08);box-shadow:0 0 0 3px rgba(168,216,234,.1)}
    .field input::placeholder{color:rgba(255,255,255,.25)}
    .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:24px;color:rgba(255,255,255,.5)}
    .row a{color:var(--accent-cyan);text-decoration:none}
    .btn-login{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#6b5b95,#4a6fa5);color:#fff;font-size:15px;letter-spacing:.1em;cursor:pointer;transition:all .3s;font-family:inherit}
    .btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(107,91,149,.4)}
    .divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:rgba(255,255,255,.3);font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
    .sso{display:flex;gap:12px;justify-content:center}
    .sso-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:18px}
    .sso-btn:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
    .btn-zhihu{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#0084FF,#0066CC);color:#fff;font-size:14px;cursor:pointer;transition:all .3s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;letter-spacing:.05em}
    .btn-zhihu:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,132,255,.4)}
    .btn-zhihu:active{transform:translateY(0)}
    .zhihu-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;background:#fff;color:#0084FF;font-size:13px;font-weight:700;font-family:'Noto Sans SC',sans-serif}
    .tip{text-align:center;font-size:12px;color:rgba(255,255,255,.35);margin-top:20px}
    .tip a{color:var(--accent-cyan);text-decoration:none}
    .skip{position:fixed;top:24px;right:24px;z-index:10;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;transition:all .3s}
    .skip:hover{color:#fff;background:rgba(255,255,255,.1)}
    /* 知乎登录弹窗 */
    .modal-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
    .modal-mask.show{display:flex}
    .zhihu-modal{width:100%;max-width:380px;background:linear-gradient(160deg,rgba(20,28,50,.95),rgba(12,18,36,.98));border:1px solid rgba(0,132,255,.2);border-radius:20px;box-shadow:0 24px 80px rgba(0,80,160,.35);overflow:hidden}
    .zhihu-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .zhihu-head .t{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
    .zhihu-head .close{background:none;border:none;color:rgba(255,255,255,.5);font-size:22px;cursor:pointer;line-height:1}
    .zhihu-head .close:hover{color:#fff}
    .zh-tabs{display:flex;gap:0;padding:0 24px}
    .zh-tab{flex:1;padding:14px 0;text-align:center;font-size:14px;color:rgba(255,255,255,.45);cursor:pointer;position:relative;transition:color .25s}
    .zh-tab.active{color:#fff}
    .zh-tab.active::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:36px;height:3px;border-radius:2px;background:linear-gradient(90deg,#0084FF,#00B4FF)}
    .zh-body{padding:24px}
    .zh-pane{display:none}
    .zh-pane.active{display:block;animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    /* 扫码 */
    .qr-box{width:200px;height:200px;margin:0 auto 16px;background:#fff;border-radius:12px;padding:10px;position:relative;display:flex;align-items:center;justify-content:center}
    .qr-box canvas{width:100%;height:100%}
    .qr-box .qr-scan{position:absolute;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,#00B4FF,transparent);animation:scan 2s linear infinite;top:10px}
    @keyframes scan{0%{top:10px}50%{top:calc(100% - 12px)}100%{top:10px}}
    .qr-tip{text-align:center;font-size:13px;color:rgba(255,255,255,.7);margin-bottom:6px}
    .qr-sub{text-align:center;font-size:12px;color:rgba(255,255,255,.35)}
    .qr-refresh{display:block;margin:14px auto 0;padding:6px 16px;border-radius:8px;background:rgba(0,132,255,.12);border:1px solid rgba(0,132,255,.3);color:#5cb6ff;font-size:12px;cursor:pointer;transition:all .25s}
    .qr-refresh:hover{background:rgba(0,132,255,.2)}
    .qr-scanned{position:absolute;inset:10px;border-radius:6px;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#fff;font-size:13px}
    .qr-scanned.show{display:flex}
    .qr-scanned .ok{font-size:28px}
    /* 密码 */
    .zh-field{margin-bottom:14px}
    .zh-field label{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px}
    .zh-field input{width:100%;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;transition:all .25s;font-family:inherit}
    .zh-field input:focus{border-color:rgba(0,132,255,.5);box-shadow:0 0 0 3px rgba(0,132,255,.1)}
    .zh-field input::placeholder{color:rgba(255,255,255,.25)}
    .zh-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:16px;color:rgba(255,255,255,.5)}
    .zh-row a{color:#5cb6ff;text-decoration:none}
    .btn-zh-login{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#0084FF,#0066CC);color:#fff;font-size:14px;cursor:pointer;transition:all .3s;font-family:inherit;letter-spacing:.05em}
    .btn-zh-login:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,132,255,.4)}
    .btn-zh-login:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
  </style>
</head>
<body>
  <div class="stars-bg" id="starsBg"></div>
  <div class="nebula pink"></div>
  <div class="nebula orange"></div>
  <button class="skip" onclick="enter()">跳过 →</button>
  <div class="login-wrap">
    <div class="logo">星愈宇宙</div>
    <div class="slogan">双盲棱镜 · 匿名共鸣</div>
    <div class="login-card">
      <div class="tab-row">
        <div class="tab active" data-tab="sms">短信登录</div>
        <div class="tab" data-tab="pwd">密码登录</div>
      </div>
      <form id="loginForm" onsubmit="enter(event)">
        <div class="field">
          <label>手机号</label>
          <input type="tel" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="field" id="smsField">
          <label>验证码</label>
          <div style="display:flex;gap:8px">
            <input type="text" placeholder="6位验证码" maxlength="6" style="flex:1">
            <button type="button" onclick="sendCode(this)" style="padding:0 14px;border-radius:10px;background:rgba(168,216,234,.1);border:1px solid rgba(168,216,234,.3);color:var(--accent-cyan);font-size:12px;cursor:pointer;white-space:nowrap">获取验证码</button>
          </div>
        </div>
        <div class="field" id="pwdField" style="display:none">
          <label>密码</label>
          <input type="password" placeholder="请输入密码">
        </div>
        <div class="row">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" style="width:auto"> 记住我</label>
          <a href="#">忘记密码？</a>
        </div>
        <button type="submit" class="btn-login">登 录</button>
      </form>
      <div class="divider">其他方式</div>
      <button type="button" class="btn-zhihu" onclick="zhihuLogin()">
        <span class="zhihu-icon">知</span>
        <span>知乎账号登录</span>
      </button>
      <div class="sso">
        <div class="sso-btn" title="微信">💬</div>
        <div class="sso-btn" title="QQ">🐧</div>
        <div class="sso-btn" title="微博">🌸</div>
        <div class="sso-btn" title="邮箱">✉</div>
      </div>
      <div class="tip">登录即表示同意 <a href="#">用户协议</a> 与 <a href="#">隐私政策</a></div>
    </div>
  </div>
  <!-- 知乎登录弹窗 -->
  <div class="modal-mask" id="zhihuModal">
    <div class="zhihu-modal">
      <div class="zhihu-head">
        <span class="t"><span class="zhihu-icon">知</span> 知乎账号登录</span>
        <button class="close" onclick="closeZhihuModal()">×</button>
      </div>
      <div class="zh-tabs">
        <div class="zh-tab active" data-zh="qr">扫码登录</div>
        <div class="zh-tab" data-zh="phone">手机号登录</div>
      </div>
      <div class="zh-body">
        <!-- 扫码登录 -->
        <div class="zh-pane active" id="zhPaneQr">
          <div class="qr-box">
            <canvas id="qrCanvas" width="180" height="180"></canvas>
            <div class="qr-scan"></div>
            <div class="qr-scanned" id="qrScanned">
              <div class="ok">✓</div>
              <div>扫码成功</div>
            </div>
          </div>
          <div class="qr-tip">打开知乎 App 扫码登录</div>
          <div class="qr-sub">二维码 60 秒内有效</div>
          <button class="qr-refresh" onclick="refreshQr()">刷新二维码</button>
        </div>
        <!-- 手机号登录 -->
        <div class="zh-pane" id="zhPanePhone">
          <div class="zh-field">
            <label>手机号</label>
            <input type="tel" id="zhPhone" placeholder="请输入知乎绑定的手机号" maxlength="11" autocomplete="tel">
          </div>
          <div class="zh-field">
            <label>验证码</label>
            <div style="display:flex;gap:8px">
              <input type="text" id="zhCode" placeholder="6位验证码" maxlength="6" autocomplete="one-time-code">
              <button type="button" class="qr-refresh" id="zhCodeBtn" onclick="sendZhCode(this)" style="margin:0;white-space:nowrap">获取验证码</button>
            </div>
          </div>
          <div class="zh-row">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" style="width:auto"> 记住我</label>
          </div>
          <button class="btn-zh-login" id="zhPhoneBtn" onclick="zhihuPhoneLogin()">登 录</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=204"></script>
  <script>
    // 生成星空
    (function(){
      const bg=document.getElementById('starsBg');
      for(let i=0;i<120;i++){
        const s=document.createElement('div');
        s.className='star';
        const size=Math.random()*2+1;
        s.style.width=size+'px';s.style.height=size+'px';
        s.style.left=Math.random()*100+'%';
        s.style.top=Math.random()*100+'%';
        s.style.animationDelay=(Math.random()*3)+'s';
        bg.appendChild(s);
      }
    })();
    // Tab切换
    document.querySelectorAll('.tab').forEach(t=>{
      t.onclick=function(){
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
        const tab=this.dataset.tab;
        document.getElementById('smsField').style.display=tab==='sms'?'':'none';
        document.getElementById('pwdField').style.display=tab==='pwd'?'':'none';
      };
    });
    function sendCode(btn){
      let n=60;btn.disabled=true;
      const t=setInterval(()=>{btn.textContent=n+'s';if(--n<0){clearInterval(t);btn.disabled=false;btn.textContent='获取验证码'}},1000);
    }
    /* —— 知乎登录弹窗 —— */
    function zhihuLogin(){
      document.getElementById('zhihuModal').classList.add('show');
      switchZhTab('qr');
      drawQr();
    }
    function closeZhihuModal(){
      document.getElementById('zhihuModal').classList.remove('show');
    }
    // 点击遮罩关闭
    document.getElementById('zhihuModal').addEventListener('click',function(e){
      if(e.target===this) closeZhihuModal();
    });
    // Tab 切换
    document.querySelectorAll('.zh-tab').forEach(t=>{
      t.onclick=function(){ switchZhTab(this.dataset.zh); };
    });
    function switchZhTab(name){
      document.querySelectorAll('.zh-tab').forEach(x=>x.classList.toggle('active',x.dataset.zh===name));
      document.getElementById('zhPaneQr').classList.toggle('active',name==='qr');
      document.getElementById('zhPanePhone').classList.toggle('active',name==='phone');
    }
    // 绘制模拟二维码
    function drawQr(){
      const c=document.getElementById('qrCanvas');
      const ctx=c.getContext('2d');
      const n=25; // 25x25 格子
      const cell=c.width/n;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle='#000';
      // 随机点阵
      for(let y=0;y<n;y++){
        for(let x=0;x<n;x++){
          if(Math.random()<0.48) ctx.fillRect(x*cell,y*cell,cell,cell);
        }
      }
      // 三个定位角
      function finder(fx,fy){
        const s=7;
        ctx.fillStyle='#fff';
        ctx.fillRect(fx*cell,fy*cell,s*cell,s*cell);
        ctx.fillStyle='#000';
        ctx.fillRect(fx*cell,fy*cell,s*cell,s*cell);
        ctx.fillStyle='#fff';
        ctx.fillRect((fx+1)*cell,(fy+1)*cell,(s-2)*cell,(s-2)*cell);
        ctx.fillStyle='#000';
        ctx.fillRect((fx+2)*cell,(fy+2)*cell,(s-4)*cell,(s-4)*cell);
      }
      finder(0,0);finder(n-7,0);finder(0,n-7);
      // 知乎 logo 中心
      const cx=c.width/2, cy=c.height/2, r=16;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0084FF';
      ctx.beginPath();ctx.arc(cx,cy,r-3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 14px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('知',cx,cy+1);
      // 重置扫码状态
      document.getElementById('qrScanned').classList.remove('show');
    }
    function refreshQr(){
      drawQr();
      // 模拟扫码成功
      setTimeout(()=>{
        document.getElementById('qrScanned').classList.add('show');
        setTimeout(()=>doLogin(),900);
      },2500);
    }
    // 手机号登录
    function sendZhCode(btn){
      const phone=document.getElementById('zhPhone').value.trim();
      if(!/^1\d{10}$/.test(phone)){alert('请输入正确的手机号');return;}
      let n=60;btn.disabled=true;
      const t=setInterval(()=>{btn.textContent=n+'s';if(--n<0){clearInterval(t);btn.disabled=false;btn.textContent='获取验证码'}},1000);
    }
    function zhihuPhoneLogin(){
      const phone=document.getElementById('zhPhone').value.trim();
      const code=document.getElementById('zhCode').value.trim();
      const btn=document.getElementById('zhPhoneBtn');
      if(!/^1\d{10}$/.test(phone)){alert('请输入正确的手机号');return;}
      if(code.length!==6){alert('请输入6位验证码');return;}
      btn.disabled=true;
      btn.textContent='登录中...';
      setTimeout(()=>doLogin(),800);
    }
    function doLogin(){
      location.href='home.html?v=200';
    }
    function enter(e){if(e)e.preventDefault();location.href='home.html?v=200';}
  </script>
</body>
</html>
