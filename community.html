    const params = new URLSearchParams(location.search);
    const planetName = params.get('planet') || '推荐广场';
    const planet = PLANETS[planetName] || PLANETS['推荐广场'];

    // 判断当前子星球属于哪个大方向（用于筛选条与返回链接）
    let bigName = params.get('big') || '爱好星球';
    if(!BIG_PLANETS[bigName]){
      // 自动识别：该子星球属于哪个大方向
      for(const bn in BIG_PLANETS){
        if(BIG_PLANETS[bn].subs.indexOf(planetName) >= 0){ bigName = bn; break; }
      }
    }
    const bigPlanet = BIG_PLANETS[bigName] || BIG_PLANETS['爱好星球'];

    // 设置行星主题色
    document.documentElement.style.setProperty('--planet-color', planet.color);
    document.documentElement.style.setProperty('--planet-glow', planet.glow);
    document.body.style.setProperty('--topic-color', planet.color);
    document.body.style.setProperty('--topic-glow', planet.glow);

    // 更新头部
    document.getElementById('headName').textContent = planetName;
    document.getElementById('headPlanet').style.background =
      'radial-gradient(circle at 30% 28%, #fff, ' + planet.color + ' 30%, ' + planet.color + ' 65%)';
    document.getElementById('headDesc').innerHTML =
      planet.desc + ' · <a href="home.html?v=100" style="color:var(--accent-cyan);text-decoration:none;">' + bigName + '</a>';

    // 渲染筛选条 — 推荐广场 + 来自不同大星球的精选社区
    const filterBar = document.getElementById('filterBar');
    // 从每个大星球各取若干子星球，组成跨星球社区列表
    const crossPlanetChips = ['推荐广场'];
    Object.keys(BIG_PLANETS).forEach(function(bn){
      const subs = BIG_PLANETS[bn].subs;
      // 每个大方向取前 2~3 个子星球
      crossPlanetChips.push.apply(crossPlanetChips, subs.slice(0, 2));
    });
    // 去重
    const chipNames = crossPlanetChips.filter(function(v, i, arr){ return arr.indexOf(v) === i; });
    chipNames.forEach(function(name){
      const chip = document.createElement('span');
      chip.className = 'chip' + (name === planetName ? ' active' : '');
      chip.textContent = name;
      chip.onclick = function(e){
        e.stopPropagation();
        // 点击推荐广场：回到跨星球视图
        if(name === '推荐广场'){
          location.href = 'community.html?v=100&planet=' + encodeURIComponent(name);
          return;
        }
        // 找到该子星球所属的大方向
        let belongBig = bigName;
        for(const bn in BIG_PLANETS){
          if(BIG_PLANETS[bn].subs.indexOf(name) >= 0){ belongBig = bn; break; }
        }
        location.href = 'community.html?v=100&big=' + encodeURIComponent(belongBig) + '&planet=' + encodeURIComponent(name);
      };
      filterBar.appendChild(chip);
    });

    // 渲染帖子
    const list = document.getElementById('feedList');
    function renderPosts(showPosts, topicLabel){
      if(showPosts.length === 0){
        list.innerHTML = '<div class="empty-state glass"><div class="ico">✧</div><div class="t">没有找到相关帖子</div><div class="s">换个关键词试试吧</div></div>';
        document.getElementById('loadMore').style.display = 'none';
        return;
      }
      list.innerHTML = showPosts.map(function(p, i){
        // 来源社区：推荐广场的帖子显示 p.source，其他星球显示当前星球名
        var srcLabel = p.source || topicLabel || planetName;
        return '<div class="post-card glass" data-id="' + i + '">' +
          '<div class="head">' +
            '<div class="avatar"></div>' +
            '<span class="name' + (p.anon ? ' anon' : '') + '">' + p.author + '</span>' +
            '<span class="time">' + p.time + '</span>' +
          '</div>' +
          '<div class="q">' + p.q + '</div>' +
          '<div class="poetic">' + p.poetic + '</div>' +
          '<div class="ai-summary"><span class="ai-tag">AI 阐释</span>' + p.ai + '</div>' +
          '<div class="stats">' +
            '<span class="stat-pill">引用 ' + Math.floor(Math.random()*50) + '</span>' +
            '<span class="stat-pill">匹配 ' + Math.floor(Math.random()*200) + '</span>' +
            '<span class="stat-pill">复用 ' + Math.floor(Math.random()*30) + '</span>' +
            '<span class="stat-pill topic" title="来自 ' + srcLabel + '">来自：' + srcLabel + '</span>' +
          '</div>' +
        '</div>';
      }).join('');
      document.getElementById('loadMore').style.display = 'block';
      // 点击帖子跳转到详情
      list.querySelectorAll('.post-card').forEach(function(card){
        card.onclick = function(){ alert('帖子详情页开发中…'); };
      });
    }

    renderPosts(PLANET_POSTS[planetName] || [], planetName);

    /* 搜索帖子：在所有星球的帖子中匹配关键词（话题/正文/诗意句/AI阐释） */
    function searchPosts(keyword){
      const kw = (keyword || '').trim().toLowerCase();
      if(!kw){ renderPosts(PLANET_POSTS[planetName] || [], planetName); return; }
      const results = [];
      Object.keys(PLANET_POSTS).forEach(function(pn){
        (PLANET_POSTS[pn] || []).forEach(function(p){
          const text = (p.q + ' ' + p.poetic + ' ' + p.ai + ' ' + p.author).toLowerCase();
          if(text.indexOf(kw) >= 0){
            results.push({post:p, planet:pn});
          }
        });
      });
      // 按帖子渲染，话题标签显示来自哪个星球
      const showPosts = results.map(function(r){ return r.post; });
      const labels = results.map(function(r){ return r.planet; });
      if(showPosts.length === 0){
        list.innerHTML = '<div class="empty-state glass"><div class="ico">✧</div><div class="t">没有找到含「' + keyword + '」的帖子</div><div class="s">试试其他关键词，或去对应星球看看</div></div>';
        document.getElementById('loadMore').style.display = 'none';
        return;
      }
      list.innerHTML = showPosts.map(function(p, i){
        return '<div class="post-card glass" data-id="' + i + '">' +
          '<div class="head">' +
            '<div class="avatar"></div>' +
            '<span class="name' + (p.anon ? ' anon' : '') + '">' + p.author + '</span>' +
            '<span class="time">' + p.time + '</span>' +
          '</div>' +
          '<div class="q">' + p.q + '</div>' +
          '<div class="poetic">' + p.poetic + '</div>' +
          '<div class="ai-summary"><span class="ai-tag">AI 阐释</span>' + p.ai + '</div>' +
          '<div class="stats">' +
            '<span class="stat-pill">引用 ' + Math.floor(Math.random()*50) + '</span>' +
            '<span class="stat-pill">匹配 ' + Math.floor(Math.random()*200) + '</span>' +
            '<span class="stat-pill">复用 ' + Math.floor(Math.random()*30) + '</span>' +
            '<span class="stat-pill topic" title="来自 ' + labels[i] + '">来自：' + labels[i] + '</span>' +
          '</div>' +
        '</div>';
      }).join('');
      document.getElementById('loadMore').style.display = 'none';
      list.querySelectorAll('.post-card').forEach(function(card){
        card.onclick = function(){ alert('帖子详情页开发中…'); };
      });
    }
  </script>
