  <meta charset="utf-8">

  <title>双盲棱镜 · 真实表达匹配体验</title>
  <link rel="stylesheet" href="css/style.css?v=302">
  <style>
    :root{
      --ink:#eef1f7;
      --muted:#9ca4b5;
      --soft:#6d7487;
      --line:rgba(255,255,255,.1);
      --panel:rgba(20,24,38,.78);
      --accent:#8ab4ff;
      --accent-light:#c4d8ff;
      --bg:#0d1020;
      --bg-deep:#07081a;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      color:var(--ink);
      background:
        radial-gradient(ellipse at 20% 10%,rgba(80,60,160,.35) 0%,transparent 50%),
        radial-gradient(ellipse at 80% 90%,rgba(40,90,160,.3) 0%,transparent 55%),
        radial-gradient(ellipse at 50% 50%,#151932 0%,var(--bg) 55%,var(--bg-deep) 100%);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
      overflow-x:hidden;
      position:relative;
      min-height:100vh;
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 20%,#fff 50%,transparent 100%),
        radial-gradient(1px 1px at 30% 70%,#c4d8ff 50%,transparent 100%),
        radial-gradient(1.2px 1.2px at 55% 35%,#fff 50%,transparent 100%),
        radial-gradient(.8px .8px at 70% 80%,#9ab8ff 50%,transparent 100%),
        radial-gradient(1px 1px at 85% 15%,#fff 50%,transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 90%,#e0ecff 50%,transparent 100%),
        radial-gradient(1px 1px at 25% 50%,#8ab4ff 50%,transparent 100%),
        radial-gradient(1.2px 1.2px at 90% 55%,#fff 50%,transparent 100%),
        radial-gradient(.8px .8px at 15% 85%,#c4d8ff 50%,transparent 100%),
        radial-gradient(1px 1px at 60% 10%,#fff 50%,transparent 100%);
      opacity:.6;
      animation:twinkle 6s ease-in-out infinite alternate;
    }
    body::after{
      content:'';
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background-image:
        radial-gradient(.6px .6px at 18% 35%,#fff 50%,transparent 100%),
        radial-gradient(.5px .5px at 42% 15%,#a8c4ff 50%,transparent 100%),
        radial-gradient(.7px .7px at 68% 65%,#fff 50%,transparent 100%),
        radial-gradient(.5px .5px at 82% 40%,#c4d8ff 50%,transparent 100%),
        radial-gradient(.6px .6px at 8% 60%,#fff 50%,transparent 100%);
      opacity:.4;
      animation:twinkle 4s ease-in-out infinite alternate-reverse;
    }
    @keyframes twinkle{
      0%{opacity:.3}
      100%{opacity:.7}
    }
    .section-inner,.topbar-inner{
      position:relative;
      z-index:1;
    }
    button,textarea,input{font:inherit}
    button{cursor:pointer;border:0;outline:0}
    button:focus-visible,input:focus-visible,textarea:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
    }

    /* Fixed top bar */
    .topbar{
      position:fixed;
      top:0;left:0;right:0;
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:20px 32px;
      backdrop-filter:blur(12px);
      background:rgba(10,12,28,.55);
      border-bottom:1px solid rgba(138,180,255,.08);
    }
    .brand{display:flex;align-items:baseline;gap:14px}
    .brand strong{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:26px;
      letter-spacing:.1em;
      font-weight:500;
    }
    .brand span{
      color:var(--muted);
      font-size:11px;
      letter-spacing:.22em;
      opacity:.8;
    }
    .status-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--accent-light);
      font-size:12px;
      letter-spacing:.12em;
      padding:7px 14px;
      border:1px solid rgba(217,167,108,.3);
      border-radius:999px;
      background:rgba(217,167,108,.06);
    }
    .status-badge .dot{
      width:6px;height:6px;border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 8px rgba(217,167,108,.6);
      animation:pulseDot 1.6s infinite;
    }
    @keyframes pulseDot{
      70%{box-shadow:0 0 0 8px rgba(217,167,108,0)}
      100%{box-shadow:0 0 0 0 rgba(217,167,108,0)}
    }

    /* Section layout */
    .section{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 24px 80px;
      position:relative;
    }
    .section.hidden-section{
      display:none;
    }
    .section-inner{
      width:min(1200px,100%);
    }

    /* Intro section */
    #introSection .section-inner{
      max-width:780px;
      text-align:center;
    }
    .eyebrow{
      color:var(--accent);
      font-size:12px;
      letter-spacing:.32em;
      text-transform:uppercase;
    }
    #introSection h1{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-weight:400;
      font-size:clamp(44px,8.5vw,82px);
      line-height:1.08;
      margin:24px 0 20px;
      letter-spacing:.02em;
    }
    #introSection h1 em{
      font-style:normal;
      background:linear-gradient(120deg,var(--accent-light),var(--accent));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .lead{
      color:var(--muted);
      line-height:1.95;
      margin:0 auto 38px;
      max-width:580px;
      font-size:15px;
    }

    .question-box{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:24px;
      padding:22px;
      text-align:left;
      box-shadow:0 28px 100px rgba(0,0,0,.3);
      backdrop-filter:blur(10px);
      position:relative;
      overflow:hidden;
    }
    .question-box::before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(138,180,255,.45),transparent);
    }
    textarea{
      display:block;
      resize:vertical;
      width:100%;
      min-height:140px;
      color:var(--ink);
      background:transparent;
      border:0;
      outline:0;
      line-height:1.9;
      font-size:16px;
    }
    textarea::placeholder{color:#6e6a64}
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-top:16px;
    }
    .hint{
      color:var(--soft);
      font-size:12px;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .hint::before{
      content:"";
      width:4px;height:4px;border-radius:50%;
      background:var(--soft);
    }

    .primary,.ghost{
      border-radius:999px;
      padding:12px 22px;
      transition:all .28s cubic-bezier(.2,.8,.2,1);
      font-size:14px;
      letter-spacing:.04em;
    }
    .primary{
      color:#0d1020;
      background:linear-gradient(135deg,var(--accent-light),var(--accent));
      box-shadow:0 4px 20px rgba(138,180,255,.3);
    }
    .primary:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 30px rgba(138,180,255,.45);
    }
    .primary:active{transform:translateY(0)}
    .ghost{
      color:var(--ink);
      background:transparent;
      border:1px solid var(--line);
    }
    .ghost:hover{
      border-color:rgba(138,180,255,.35);
      background:rgba(138,180,255,.08);
    }

    .promise{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-top:60px;
      text-align:left;
    }
    .promise article{
      padding:22px 20px;
      border-top:1px solid var(--line);
      color:var(--muted);
      line-height:1.75;
      font-size:13px;
      position:relative;
      transition:border-color .3s;
    }
    .promise article:hover{
      border-top-color:rgba(217,167,108,.4);
    }
    .promise b{
      display:block;
      color:var(--ink);
      font-weight:500;
      margin-bottom:8px;
      font-size:14px;
    }
    .promise .num{
      position:absolute;
      top:18px;right:18px;
      font-family:Georgia,serif;
      font-size:11px;
      color:var(--soft);
      letter-spacing:.15em;
    }

    .scroll-hint{
      position:absolute;
      bottom:40px;
      left:50%;
      transform:translateX(-50%);
      color:var(--soft);
      font-size:12px;
      letter-spacing:.2em;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      opacity:.6;
      animation:floatDown 2.5s ease-in-out infinite;
    }
    .scroll-hint .arrow{
      width:1px;height:30px;
      background:linear-gradient(to bottom,var(--soft),transparent);
    }
    @keyframes floatDown{
      0%,100%{transform:translateX(-50%) translateY(0);opacity:.5}
      50%{transform:translateX(-50%) translateY(8px);opacity:.8}
    }

    /* Ocean section */
    #oceanSection{
      flex-direction:column;
      justify-content:center;
      padding-top:80px;
    }
    #oceanSection .section-inner{
      width:min(1200px,100%);
    }
    .thinking-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:24px;
      margin-bottom:24px;
    }
    .thinking-head h2{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:32px;
      font-weight:400;
      margin:0 0 6px;
      letter-spacing:.02em;
    }
    .thinking-copy{
      color:var(--muted);
      margin:0;
      font-size:14px;
    }

    .progress-wrap{
      margin:24px 0 20px;
    }
    .progress-label{
      display:flex;
      justify-content:space-between;
      color:var(--soft);
      font-size:12px;
      margin-bottom:10px;
      letter-spacing:.05em;
    }
    .progress{
      height:2px;
      border-radius:10px;
      background:rgba(255,255,255,.08);
      overflow:hidden;
    }
    .progress i{
      display:block;
      width:0;
      height:100%;
      background:linear-gradient(90deg,var(--accent),var(--accent-light));
      transition:width .1s linear;
      box-shadow:0 0 10px rgba(138,180,255,.6);
    }

    /* Ocean container - full viewport feel */
    .ocean-stage{
      position:relative;
      height:50vh;
      min-height:360px;
      max-height:500px;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      overflow:hidden;
      border-radius:4px;
      perspective:1200px;
      perspective-origin:50% 50%;
    }
    .ocean-stage::before,
    .ocean-stage::after{
      content:"";
      position:absolute;
      z-index:10;
      top:0;bottom:0;
      width:22%;
      pointer-events:none;
    }
    .ocean-stage::before{
      left:0;
      background:linear-gradient(90deg,var(--bg-deep),transparent);
    }
    .ocean-stage::after{
      right:0;
      background:linear-gradient(-90deg,var(--bg-deep),transparent);
    }

    .depth-layer{
      position:absolute;
      left:0;right:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:14px;
      height:100%;
      transform-style:preserve-3d;
      will-change:transform;
    }
    .depth-layer.far{
      transform:translateZ(-120px) scale(.75);
      opacity:.35;
      filter:blur(2px);
    }
    .depth-layer.mid{
      transform:translateZ(-40px) scale(.9);
      opacity:.65;
      filter:blur(.6px);
    }
    .depth-layer.near{
      transform:translateZ(0) scale(1);
      opacity:1;
      filter:blur(0);
    }

    .lane{
      position:relative;
      overflow:hidden;
      height:52px;
      display:flex;
      align-items:center;
    }
    .depth-layer.far .lane{height:44px}
    .depth-layer.near .lane{height:60px}

    .track{
      display:flex;
      gap:14px;
      width:max-content;
      will-change:transform;
      animation:drift var(--dur,8s) linear infinite;
      animation-delay:var(--delay,0s);
    }
    @keyframes drift{
      from{transform:translateX(-40%)}
      to{transform:translateX(0%)}
    }

    .quote-chip{
      display:flex;
      align-items:center;
      flex-shrink:0;
      min-height:44px;
      padding:8px 16px;
      color:#c8d0e0;
      background:rgba(138,180,255,.05);
      border:1px solid rgba(138,180,255,.12);
      border-radius:12px;
      white-space:nowrap;
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:14px;
      transition:all .6s ease;
      will-change:opacity,filter,transform;
      box-shadow:0 0 12px rgba(138,180,255,.06);
    }
    .depth-layer.far .quote-chip{
      font-size:12px;
      min-height:36px;
      padding:6px 12px;
      border-radius:10px;
    }
    .depth-layer.near .quote-chip{
      font-size:16px;
      min-height:52px;
      padding:10px 18px;
      border-radius:14px;
    }

    /* Phase states */
    .ocean-stage.phase-filter .quote-chip.fading{
      opacity:.15;
      filter:blur(3px);
    }
    .ocean-stage.phase-slow .track{
      animation-play-state:paused;
    }
    .ocean-stage.phase-slow .quote-chip:not(.candidate){
      opacity:.08;
      filter:blur(5px);
    }
    .ocean-stage.phase-slow .quote-chip.candidate{
      color:var(--accent-light);
      border-color:rgba(138,180,255,.5);
      box-shadow:0 0 24px rgba(138,180,255,.25);
    }

    /* Center marker line */
    .center-marker{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:2px;
      height:60%;
      background:linear-gradient(to bottom,transparent,rgba(138,180,255,.35),transparent);
      opacity:0;
      transition:opacity .5s ease;
      z-index:5;
      pointer-events:none;
    }
    .center-marker.show{opacity:1}

    /* Final reveal - centered in ocean */
    .final-quote-wrapper{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      z-index:20;
      opacity:0;
      pointer-events:none;
      transition:opacity .6s ease;
      padding-top:0;
      align-content:center;
    }
    .final-quote-wrapper.show{
      opacity:1;
      pointer-events:auto;
    }
    .final-quote{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:14px;
      line-height:1.4;
      color:var(--accent-light);
      text-align:center;
      padding:10px 20px;
      background:rgba(138,180,255,.12);
      border:1px solid rgba(138,180,255,.35);
      border-radius:10px;
      transform:scale(.9) translateY(20px);
      opacity:0;
      transition:all 1s cubic-bezier(.2,.8,.2,1);
      white-space:nowrap;
      box-shadow:0 0 30px rgba(138,180,255,.25);
    }
    .final-quote-wrapper.show .final-quote{
      transform:scale(1) translateY(0);
      opacity:1;
    }
    .match-note{
      display:flex;
      justify-content:center;
      gap:10px;
      align-items:center;
      color:var(--muted);
      font-size:13px;
      margin-top:24px;
      letter-spacing:.04em;
    }
    .pulse{
      width:7px;height:7px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 0 rgba(217,167,108,.6);
      animation:pulse 1.6s infinite;
    }
    @keyframes pulse{
      70%{box-shadow:0 0 0 10px rgba(217,167,108,0)}
      100%{box-shadow:0 0 0 0 rgba(217,167,108,0)}
    }

    .skip-row{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-top:22px;
    }

    /* Chat section */
    #chatSection{
      padding-top:100px;
      align-items:flex-start;
      min-height:auto;
    }
    .chat-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:24px;
      margin-bottom:32px;
    }
    .chat-head h2{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:30px;
      font-weight:400;
      margin:0 0 6px;
      letter-spacing:.02em;
    }

    .chat-layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 300px;
      gap:32px;
      align-items:start;
    }
    .chat-window{max-width:100%}
    .chat-window-full{
      max-width:720px;
      margin:0 auto;
      width:100%;
    }

    .message{
      display:flex;
      gap:14px;
      margin:22px 0;
      align-items:flex-start;
      animation:msgIn .5s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes msgIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    .message.user{justify-content:flex-end}

    .avatar{
      width:36px;height:36px;
      flex:0 0 36px;
      display:grid;
      place-items:center;
      border:1px solid var(--line);
      border-radius:50%;
      color:var(--accent-light);
      font-family:Georgia,serif;
      font-size:13px;
      background:rgba(255,255,255,.03);
    }

    .bubble{
      max-width:min(620px,78%);
      padding:15px 20px;
      border:1px solid var(--line);
      border-radius:18px;
      line-height:1.9;
      white-space:pre-line;
      font-size:14.5px;
    }
    .message.user .bubble{
      color:#0d1020;
      background:linear-gradient(135deg,var(--accent-light),var(--accent));
      border-color:transparent;
      border-bottom-right-radius:6px;
      box-shadow:0 4px 18px rgba(138,180,255,.25);
    }
    .message.ai .bubble{
      background:rgba(255,255,255,.045);
      border-bottom-left-radius:6px;
    }

    /* Quote result card */
    .quote-result{
      margin:14px 0 28px 50px;
      padding:32px 34px;
      background:
        linear-gradient(145deg,rgba(138,180,255,.15),rgba(255,255,255,.02) 60%);
      border:1px solid rgba(138,180,255,.25);
      border-radius:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.3),0 0 40px rgba(138,180,255,.08);
      animation:quoteReveal 1.6s cubic-bezier(.2,.8,.2,1) both;
      position:relative;
      overflow:hidden;
    }
    .quote-result::before{
      content:"";
      position:absolute;
      top:0;left:0;right:0;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(138,180,255,.5),transparent);
    }
    @keyframes quoteReveal{
      0%{opacity:0;transform:translateY(26px) scale(.94);filter:blur(14px)}
      60%{filter:blur(0)}
      100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
    }
    .quote-result blockquote{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:clamp(20px,2.8vw,30px);
      line-height:1.55;
      margin:0 0 10px;
      color:var(--accent-light);
      font-weight:400;
      letter-spacing:.01em;
    }
    .quote-label{
      color:var(--soft);
      font-size:11px;
      letter-spacing:.22em;
      margin-bottom:16px;
      text-transform:uppercase;
    }

    .source-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:22px;
    }
    .source-actions button{
      color:var(--muted);
      background:transparent;
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 14px;
      font-size:12.5px;
      transition:all .25s ease;
      letter-spacing:.03em;
    }
    .source-actions button:hover{
      color:var(--accent-light);
      border-color:rgba(138,180,255,.5);
      background:rgba(138,180,255,.1);
    }
    .source-actions button.active{
      color:var(--accent-light);
      border-color:rgba(138,180,255,.5);
      background:rgba(138,180,255,.1);
    }

    .source-panel{
      display:none;
      padding-top:20px;
      margin-top:22px;
      border-top:1px solid rgba(217,167,108,.18);
      color:var(--muted);
      line-height:1.8;
      font-size:13px;
      animation:sourceIn .5s ease both;
    }
    .source-panel.visible{display:block}
    @keyframes sourceIn{
      from{opacity:0;transform:translateY(-6px)}
      to{opacity:1;transform:translateY(0)}
    }
    .source-panel b{
      color:var(--ink);
      font-weight:500;
      font-size:14px;
    }
    .source-panel .source-type{
      display:inline-block;
      margin-top:6px;
      padding:3px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:11px;
      color:var(--soft);
    }
    .source-panel .source-note{
      margin-top:10px;
      color:var(--soft);
      font-size:12px;
      font-style:italic;
    }

    /* Side card */
    .side-card{
      padding:24px;
      border:1px solid var(--line);
      border-radius:20px;
      background:rgba(255,255,255,.03);
      position:sticky;
      top:100px;
    }
    .side-card h3{
      font-size:14px;
      font-weight:500;
      margin:0 0 14px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .side-card h3::before{
      content:"";
      width:3px;height:14px;
      border-radius:2px;
      background:var(--accent);
    }
    .side-card p{
      color:var(--muted);
      font-size:12.5px;
      line-height:1.85;
      margin:0 0 14px;
    }
    .side-card ul{
      margin:0;
      padding-left:18px;
      color:var(--muted);
      font-size:12.5px;
      line-height:1.9;
    }

    /* Chat input */
    .chat-input{
      display:flex;
      gap:10px;
      margin:34px 0 0 50px;
      animation:msgIn .5s ease both;
    }
    .chat-input input{
      flex:1;
      min-width:0;
      color:var(--ink);
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      border-radius:999px;
      padding:13px 18px;
      outline:0;
      transition:border-color .25s;
      font-size:14px;
    }
    .chat-input input:focus{
      border-color:rgba(138,180,255,.55);
    }
    .chat-input input::placeholder{color:#6d7487}

    /* 3D card flip */
    .chat-flip{
      perspective:1800px;
      min-height:400px;
    }
    .chat-flip-inner{
      position:relative;
      width:100%;
      min-height:400px;
      transform-style:preserve-3d;
      transition:transform .9s cubic-bezier(.2,.8,.2,1);
    }
    .chat-flip-inner.flipped{
      transform:rotateY(180deg);
    }
    .chat-face{
      position:absolute;
      top:0;left:0;
      width:100%;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }
    .chat-face.back{
      transform:rotateY(180deg);
    }

    /* Draft / ask card */
    .ask-card{
      margin-top:10px;
    }
    .ask-card h2{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:30px;
      font-weight:400;
      margin:0 0 8px;
    }
    .ask-card .lead{
      color:var(--muted);
      line-height:1.8;
      margin:0 0 24px;
      font-size:14px;
    }
    .ask-card .question-box{
      margin-top:0;
    }

    /* Draft carousel */
    .draft-indicator{
      display:flex;
      justify-content:center;
      gap:8px;
      margin:18px 0 6px;
    }
    .draft-dot{
      width:6px;height:6px;
      border-radius:50%;
      background:rgba(255,255,255,.2);
      transition:all .3s;
      cursor:pointer;
    }
    .draft-dot.active{
      width:22px;
      border-radius:3px;
      background:var(--accent);
    }
    .draft-nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:14px;
      color:var(--soft);
      font-size:12px;
    }
    .draft-nav button{
      background:none;
      border:0;
      color:var(--muted);
      padding:6px 10px;
      font-size:12px;
      border-radius:8px;
      transition:all .2s;
    }
    .draft-nav button:hover{
      color:var(--accent-light);
      background:rgba(217,167,108,.1);
    }
    .draft-nav button:disabled{
      opacity:.3;
      cursor:not-allowed;
    }

    /* Back face sub-pages */
    .back-subpage{
      position:absolute;
      top:0;left:0;
      width:100%;
      opacity:0;
      pointer-events:none;
      transform:translateY(10px);
      transition:opacity .35s ease, transform .35s ease;
    }
    .back-subpage.active{
      opacity:1;
      pointer-events:auto;
      transform:translateY(0);
      position:relative;
    }

    /* Action buttons row */
    .action-row{
      display:flex;
      gap:10px;
      margin-top:16px;
    }
    .action-row button{
      flex:1;
      padding:12px 16px;
      border-radius:12px;
      font-size:13px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      color:var(--muted);
      transition:all .25s;
    }
    .action-row button:hover{
      border-color:rgba(217,167,108,.4);
      color:var(--accent-light);
      background:rgba(217,167,108,.08);
    }

    /* Draft saved page */
    .saved-card{
      padding:40px 32px;
      text-align:center;
      border:1px solid rgba(138,180,255,.28);
      border-radius:20px;
      background:rgba(138,180,255,.07);
    }
    .saved-icon{
      width:56px;height:56px;
      margin:0 auto 18px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:rgba(138,180,255,.18);
      color:var(--accent-light);
      font-size:28px;
    }
    .saved-card h3{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:24px;
      font-weight:400;
      margin:0 0 8px;
    }
    .saved-card p{
      color:var(--muted);
      font-size:13.5px;
      line-height:1.8;
      margin:0 0 22px;
    }
    .saved-preview{
      padding:14px 18px;
      background:rgba(0,0,0,.2);
      border-radius:12px;
      text-align:left;
      color:var(--ink);
      font-size:13.5px;
      line-height:1.7;
      margin-bottom:20px;
      max-height:100px;
      overflow:hidden;
    }
    .saved-actions{
      display:flex;
      gap:10px;
      justify-content:center;
    }
    .saved-actions button{
      padding:10px 20px;
      border-radius:999px;
      font-size:13px;
    }

    /* Publish page */
    .publish-card{
      padding:28px 28px;
      border:1px solid var(--line);
      border-radius:20px;
      background:rgba(255,255,255,.03);
    }
    .publish-card h3{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:22px;
      font-weight:400;
      margin:0 0 4px;
    }
    .publish-card .sub{
      color:var(--muted);
      font-size:12.5px;
      margin:0 0 20px;
    }
    .publish-field{
      margin-bottom:16px;
    }
    .publish-field label{
      display:block;
      color:var(--soft);
      font-size:12px;
      margin-bottom:8px;
      letter-spacing:.05em;
    }
    .publish-field input,
    .publish-field textarea{
      width:100%;
      color:var(--ink);
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 14px;
      font-size:14px;
      outline:0;
      transition:border-color .25s;
      line-height:1.7;
      resize:vertical;
    }
    .publish-field input:focus,
    .publish-field textarea:focus{
      border-color:rgba(138,180,255,.55);
    }
    .topic-tags{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .topic-tag{
      padding:6px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      background:rgba(255,255,255,.03);
      cursor:pointer;
      transition:all .2s;
    }
    .topic-tag:hover{
      border-color:rgba(138,180,255,.45);
      color:var(--accent-light);
    }
    .topic-tag.active{
      border-color:rgba(138,180,255,.6);
      color:var(--accent-light);
      background:rgba(138,180,255,.12);
    }
    .publish-footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:22px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }
    .publish-footer .note{
      color:var(--soft);
      font-size:11.5px;
    }

    /* End section */
    .end-card{
      max-width:560px;
      margin:0 auto;
      text-align:center;
      padding:60px 40px;
      border:1px solid rgba(138,180,255,.22);
      border-radius:24px;
      background:
        radial-gradient(ellipse at top,rgba(138,180,255,.12),transparent 60%),
        rgba(255,255,255,.02);
      box-shadow:0 0 60px rgba(138,180,255,.08);
    }
    .end-card .icon{
      width:64px;height:64px;
      margin:0 auto 24px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:rgba(138,180,255,.18);
      color:var(--accent-light);
      font-size:30px;
    }
    .end-card h2{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-size:32px;
      font-weight:400;
      margin:0 0 10px;
    }
    .end-card .end-sub{
      color:var(--muted);
      line-height:1.8;
      margin:0 0 32px;
      font-size:14px;
    }
    .end-quote{
      padding:22px 26px;
      background:rgba(0,0,0,.25);
      border-radius:16px;
      text-align:left;
      margin-bottom:28px;
      border-left:3px solid var(--accent);
    }
    .end-quote .end-quote-label{
      color:var(--soft);
      font-size:11px;
      letter-spacing:.2em;
      margin-bottom:10px;
    }
    .end-quote p{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      color:var(--accent-light);
      font-size:18px;
      line-height:1.6;
      margin:0;
    }
    .end-actions{
      display:flex;
      gap:12px;
      justify-content:center;
    }
    .end-actions button{
      padding:12px 24px;
      border-radius:999px;
      font-size:14px;
    }
    .btn-gold-outline{
      background:transparent;
      border:1px solid var(--accent);
      color:var(--accent-light);
      transition:all .25s;
      font-size:13px;
      padding:10px 18px;
      letter-spacing:.03em;
      border-radius:999px;
    }
    .btn-gold-outline:hover{
      background:rgba(138,180,255,.12);
      box-shadow:0 0 16px rgba(138,180,255,.25);
    }

    /* Flow section */
    .flow-section{
      margin-top:84px;
      padding-top:36px;
      border-top:1px solid var(--line);
    }
    .flow-section h2{
      font-family:Georgia,"Noto Serif CJK SC",serif;
      font-weight:400;
      margin:0 0 10px;
      font-size:26px;
    }
    .flow-section p{
      color:var(--muted);
      font-size:13.5px;
      margin:0 0 24px;
    }
    .flow-section img{
      display:block;
      width:100%;
      border:1px solid var(--line);
      border-radius:20px;
      background:#151615;
    }
    .disclaimer{
      margin-top:14px;
      padding:14px 18px;
      border:1px solid rgba(217,167,108,.2);
      border-radius:12px;
      background:rgba(217,167,108,.05);
      color:var(--muted);
      font-size:12.5px;
      line-height:1.8;
    }
    .disclaimer strong{
      color:var(--accent-light);
      font-weight:500;
    }

    /* Responsive */
    @media(max-width:860px){
      .topbar{padding:16px 20px}
      .brand strong{font-size:22px}
      .section{padding:90px 20px 60px}
      .promise{
        grid-template-columns:1fr;
        margin-top:38px;
        gap:0;
      }
      .promise article{
        border-top:0;
        border-bottom:1px solid var(--line);
      }
      .thinking-head,.chat-head{
        align-items:flex-start;
        flex-direction:column;
      }
      .chat-layout{grid-template-columns:1fr}
      .side-card{order:-1;position:static}
      .quote-result,.chat-input{margin-left:0}
      .ask-card{margin-left:0}
      .bubble{max-width:84%}
      .ocean-stage{min-height:300px;height:40vh}
      .flow-section{margin-top:56px}
    }

    /* Reduced motion */
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .depth-layer{transform:none!important;filter:none!important}
      .track{animation:none!important}
      .scroll-hint{display:none}
    }

    /* Cosmic visual theme: color and surface treatment only. */
    :root{
      --ink:#eef2ff;
      --muted:#9aa4c4;
      --soft:#6d7699;
      --line:rgba(138,180,255,.18);
      --panel:rgba(15,20,42,.75);
      --accent:#7aa8ff;
      --accent-light:#c8dbff;
      --bg:#0a0d1e;
      --bg-deep:#050616;
    }
    body{
      background:
        radial-gradient(ellipse at 50% 40%,rgba(60,100,190,.22) 0%,transparent 32%),
        radial-gradient(ellipse at 15% 75%,rgba(40,80,170,.24) 0%,transparent 36%),
        radial-gradient(ellipse at 85% 20%,rgba(80,120,200,.18) 0%,transparent 38%),
        linear-gradient(160deg,#050618 0%,#0a1028 50%,#0d1530 100%);
    }
    body::before{
      background-image:
        radial-gradient(1.5px 1.5px at 10% 20%,#e8f0ff 50%,transparent 100%),
        radial-gradient(1px 1px at 30% 70%,#8ab4ff 50%,transparent 100%),
        radial-gradient(1.2px 1.2px at 55% 35%,#fff 50%,transparent 100%),
        radial-gradient(.8px .8px at 70% 80%,#a8c8ff 50%,transparent 100%),
        radial-gradient(1px 1px at 85% 15%,#fff 50%,transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 90%,#d0e0ff 50%,transparent 100%),
        radial-gradient(1px 1px at 25% 50%,#6a9fff 50%,transparent 100%),
        radial-gradient(1.2px 1.2px at 90% 55%,#fff 50%,transparent 100%),
        radial-gradient(.8px .8px at 15% 85%,#b8d0ff 50%,transparent 100%),
        radial-gradient(1px 1px at 60% 10%,#fff 50%,transparent 100%);
      opacity:.75;
    }
    body::after{
      background-image:
        radial-gradient(.6px .6px at 18% 35%,#fff 50%,transparent 100%),
        radial-gradient(.5px .5px at 42% 15%,#9ab8ff 50%,transparent 100%),
        radial-gradient(.7px .7px at 68% 65%,#fff 50%,transparent 100%),
        radial-gradient(.5px .5px at 82% 40%,#c8dbff 50%,transparent 100%),
        radial-gradient(.6px .6px at 8% 60%,#fff 50%,transparent 100%);
      opacity:.5;
    }
    .topbar{background:linear-gradient(180deg,rgba(7,10,25,.65),transparent);}
    .brand strong{color:#f0f4ff;text-shadow:0 0 22px rgba(122,168,255,.4)}
    .brand span,.status-badge{color:#a8b8e0}
    .status-badge{background:rgba(60,90,170,.15);border-color:rgba(122,168,255,.3);box-shadow:0 0 20px rgba(60,100,190,.15)}
    .status-badge .dot{background:#7aa8ff;box-shadow:0 0 12px #7aa8ff}
    .eyebrow{color:#8ab4ff;text-shadow:0 0 18px rgba(122,168,255,.3)}
    #introSection h1 em{color:#b8d0ff;text-shadow:0 0 28px rgba(122,168,255,.35)}
    .lead,.thinking-copy,.flow-section p,.side-card p,.source-panel,.hint{color:var(--muted)}
    .question-box,.side-card,.ask-card,.saved-card,.publish-card,.end-card{
      background:linear-gradient(145deg,rgba(25,35,70,.7),rgba(10,14,32,.78));
      border-color:rgba(122,168,255,.2);
      box-shadow:0 22px 70px rgba(2,5,20,.5),inset 0 1px 0 rgba(255,255,255,.05);
    }
    .question-box::before{background:linear-gradient(90deg,transparent,#7aa8ff,transparent);box-shadow:0 0 20px rgba(122,168,255,.5)}
    textarea,input{color:var(--ink)}
    textarea::placeholder,input::placeholder{color:#6d7699}
    .primary{color:#0a0d1e;background:linear-gradient(135deg,#c8dbff,#7aa8ff);border-color:#c8dbff;box-shadow:0 0 24px rgba(122,168,255,.3)}
    .primary:hover{background:linear-gradient(135deg,#e0ecff,#9ac0ff);box-shadow:0 0 32px rgba(122,168,255,.45)}
    .ghost,.source-actions button,.action-row button,.saved-actions button,.end-actions button,.draft-nav button{color:#d0d8f0;border-color:rgba(122,168,255,.25);background:rgba(60,100,180,.08)}
    .ghost:hover,.source-actions button:hover,.action-row button:hover,.saved-actions button:hover,.end-actions button:hover,.draft-nav button:hover{color:#fff;border-color:#7aa8ff;background:rgba(80,130,210,.18);box-shadow:0 0 20px rgba(80,130,210,.2)}
    .promise article{border-color:rgba(122,168,255,.15)}
    .promise article:hover{background:rgba(60,100,180,.1);border-color:rgba(122,168,255,.32)}
    .promise b,.flow-section h2,.thinking-head h2,.chat-head h2,.ask-card h2,.end-card h2{color:#eef2ff}
    .progress{background:rgba(122,168,255,.12)}
    .progress i{background:linear-gradient(90deg,#5a8fff,#9ac0ff,#bde0ff);box-shadow:0 0 14px rgba(122,168,255,.55)}
    .ocean-stage{background:radial-gradient(ellipse at center,rgba(50,90,170,.22),rgba(5,8,25,.1) 52%,transparent 75%);border-color:rgba(122,168,255,.15)}
    .ocean-stage::before{border-color:rgba(122,168,255,.5);box-shadow:0 0 18px rgba(100,150,230,.3),inset 0 0 24px rgba(80,130,210,.1)}
    .ocean-stage::after{background:radial-gradient(circle at 50% 50%,rgba(180,210,255,.22),rgba(100,150,230,.1) 25%,transparent 64%)}
    .center-marker{border-color:#8ab4ff;box-shadow:0 0 20px #7aa8ff,0 0 60px rgba(100,150,230,.5)}
    .quote-chip{color:#dce4f7;background:linear-gradient(135deg,rgba(45,65,120,.3),rgba(25,40,85,.25));border-color:rgba(122,168,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px rgba(50,90,170,.1)}
    .depth-layer.far .quote-chip{color:#8590b8}
    .depth-layer.near .quote-chip{color:#e8efff;border-color:rgba(138,180,255,.38);box-shadow:0 0 24px rgba(80,130,210,.18)}
    .quote-chip.candidate{color:#eef4ff;border-color:#8ab4ff;background:linear-gradient(135deg,rgba(80,130,210,.4),rgba(50,100,180,.3));box-shadow:0 0 32px rgba(100,150,230,.4),inset 0 0 18px rgba(180,210,255,.1)}
    .final-quote-wrapper{filter:drop-shadow(0 0 40px rgba(100,150,230,.4))}
    .final-quote{color:#eef4ff;background:linear-gradient(145deg,rgba(55,90,170,.7),rgba(20,40,90,.75));border-color:rgba(160,195,255,.6);box-shadow:0 0 42px rgba(80,130,210,.35),inset 0 1px 0 rgba(255,255,255,.15)}
    .final-quote::after{background:linear-gradient(90deg,#7aa8ff,#a8c8ff,#bde0ff)}
    .pulse{background:#8ab4ff;box-shadow:0 0 0 0 rgba(138,180,255,.6)}
    .chat-section{background:radial-gradient(ellipse at 16% 20%,rgba(50,90,170,.12),transparent 42%)}
    .message.user .bubble{color:#0a0d1e;background:linear-gradient(135deg,#d8e6ff,#8ab4ff);border-color:#d8e6ff;box-shadow:0 8px 24px rgba(80,130,210,.22)}
    .message.ai .bubble{background:linear-gradient(145deg,rgba(30,40,75,.7),rgba(12,18,42,.78));border-color:rgba(122,168,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
    .avatar{color:#c8dbff;border-color:rgba(122,168,255,.38);background:rgba(50,80,150,.16);box-shadow:0 0 18px rgba(80,130,210,.18)}
    .quote-result{background:linear-gradient(145deg,rgba(45,70,130,.35),rgba(18,28,65,.65));border-color:rgba(138,180,255,.4);box-shadow:0 20px 70px rgba(3,5,20,.5),0 0 36px rgba(80,130,210,.15)}
    .quote-result::before{background:linear-gradient(90deg,#6a9fff,#9ac0ff,#bde0ff);box-shadow:0 0 18px rgba(122,168,255,.5)}
    .quote-result blockquote,.quote-label,.source-panel b,.disclaimer strong{color:#e8efff}
    .source-panel{border-top-color:rgba(122,168,255,.2)}
    .source-actions button.active{color:#fff;background:rgba(80,130,210,.28);border-color:#8ab4ff;box-shadow:0 0 18px rgba(80,130,210,.22)}
    .flow-section{border-top-color:rgba(122,168,255,.18)}
    .flow-section img{background:#090d22;border-color:rgba(122,168,255,.22);box-shadow:0 20px 55px rgba(2,4,18,.35)}
    .disclaimer{background:rgba(60,100,180,.08);border-color:rgba(122,168,255,.18)}
    .end-quote{background:linear-gradient(145deg,rgba(45,65,120,.3),rgba(20,30,65,.6));border-color:rgba(122,168,255,.24)}
    .end-quote p{color:#e8efff}
    .btn-gold-outline:hover{background:rgba(122,168,255,.12);box-shadow:0 0 16px rgba(122,168,255,.22)}
    .topic-tag:hover{border-color:rgba(122,168,255,.4)}
    .topic-tag.active{border-color:rgba(122,168,255,.55);background:rgba(122,168,255,.12)}
    .publish-field input:focus,
    .publish-field textarea:focus{border-color:rgba(122,168,255,.5)}
    .chat-input input:focus{border-color:rgba(122,168,255,.5)}
    .end-card{
      border-color:rgba(122,168,255,.2);
      background:
        radial-gradient(ellipse at top,rgba(80,130,210,.12),transparent 60%),
        rgba(255,255,255,.02);
      box-shadow:0 0 50px rgba(80,130,210,.08);
    }
    .end-card .icon{background:rgba(122,168,255,.16);color:var(--accent-light)}
    .saved-card{border-color:rgba(122,168,255,.25);background:rgba(122,168,255,.06)}
    .saved-icon{background:rgba(122,168,255,.16);color:var(--accent-light)}
    /* 嵌入外部双盲诗页面 */
    .prism-embed{
      display:block;
      width:100%;
      height:calc(100vh - 64px);
      border:0;
      background:transparent;
    }
  </style>
</head>

</body>
