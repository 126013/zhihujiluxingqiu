<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>try{var p=(location.pathname.split('/').pop()||'').toLowerCase();var l=p==='community.html'||p==='messages.html';document.documentElement.setAttribute('data-theme',l?(localStorage.getItem('starheal-theme')||'dark'):'dark')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070f">
  <title>设置 — 星愈·双盲棱镜</title>
  <link rel="stylesheet" href="css/style.css?v=302">
  <style>
    .page{padding-top:72px;padding-bottom:60px;max-width:860px;margin:0 auto}
    .page-header{padding:20px 24px 0;margin-bottom:16px;display:flex;align-items:center;gap:12px}
    .page-header .back{color:rgba(255,255,255,.5);cursor:pointer;font-size:18px;transition:color .25s}
    .page-header .back:hover{color:#fff}
    .page-header h1{font-size:20px;font-weight:600;letter-spacing:.06em;color:#fff}
    .section{margin-bottom:18px;padding:0 24px}
    .section-title{font-size:12px;color:var(--text-dim);padding:0 8px 10px;letter-spacing:.1em;text-transform:uppercase}
    .menu-list{border-radius:14px;overflow:hidden}
    .menu-item{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:all .2s;border-bottom:1px solid rgba(255,255,255,.04)}
    .menu-item:last-child{border-bottom:none}
    .menu-item:hover{background:rgba(255,255,255,.03)}
    .menu-item .ico{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .menu-item .label{flex:1;font-size:14px;color:var(--text-star)}
    .menu-item .sub{font-size:12px;color:var(--text-faint)}
    .menu-item .arrow{color:var(--text-faint);font-size:14px}
    .menu-item .toggle{width:40px;height:22px;border-radius:12px;background:rgba(255,255,255,.1);position:relative;cursor:pointer;transition:background .25s}
    .menu-item .toggle.on{background:linear-gradient(135deg,#6b5b95,#4a6fa5)}
    .menu-item .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s}
    .menu-item .toggle.on::after{transform:translateX(18px)}
    .menu-item.danger .label{color:#ff8080}
    .menu-item.danger .ico{background:rgba(255,80,80,.08)}
    .logout-btn{margin:24px;padding:14px;border-radius:14px;background:rgba(255,60,60,.08);border:1px solid rgba(255,100,100,.3);color:#ff8080;font-size:15px;cursor:pointer;transition:all .25s;font-family:inherit;letter-spacing:.05em;display:block;width:calc(100% - 48px)}
    .logout-btn:hover{background:rgba(255,60,60,.18);border-color:rgba(255,100,100,.5);color:#fff}
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;background:rgba(20,16,40,.95);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;z-index:999;animation:toastIn .3s}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <span class="back" onclick="history.back()">←</span>
      <h1>设置</h1>
    </div>

    <!-- 账号 -->
    <div class="section">
      <div class="section-title">账号</div>
      <div class="menu-list glass">
        <div class="menu-item" onclick="toast('账号与安全功能开发中…')">
          <div class="ico">🔒</div><span class="label">账号与安全</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('绑定手机功能开发中…')">
          <div class="ico">📱</div><span class="label">绑定手机</span><span class="sub">138****8888</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('第三方账号功能开发中…')">
          <div class="ico">🔗</div><span class="label">第三方账号</span><span class="arrow">›</span>
        </div>
      </div>
    </div>

    <!-- 通知 -->
    <div class="section">
      <div class="section-title">通知</div>
      <div class="menu-list glass">
        <div class="menu-item">
          <div class="ico">🔔</div><span class="label">新消息通知</span>
          <div class="toggle on" onclick="this.classList.toggle('on')"></div>
        </div>
        <div class="menu-item">
          <div class="ico">💬</div><span class="label">回复提醒</span>
          <div class="toggle on" onclick="this.classList.toggle('on')"></div>
        </div>
        <div class="menu-item">
          <div class="ico">❤️</div><span class="label">点赞提醒</span>
          <div class="toggle" onclick="this.classList.toggle('on')"></div>
        </div>
        <div class="menu-item">
          <div class="ico">@</div><span class="label">@我提醒</span>
          <div class="toggle on" onclick="this.classList.toggle('on')"></div>
        </div>
      </div>
    </div>

    <!-- 隐私 -->
    <div class="section">
      <div class="section-title">隐私</div>
      <div class="menu-list glass">
        <div class="menu-item">
          <div class="ico">🕶</div><span class="label">默认匿名发布</span>
          <div class="toggle on" onclick="this.classList.toggle('on')"></div>
        </div>
        <div class="menu-item" onclick="toast('黑名单功能开发中…')">
          <div class="ico">🚫</div><span class="label">黑名单</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('隐私政策查看')">
          <div class="ico">📜</div><span class="label">隐私政策</span><span class="arrow">›</span>
        </div>
      </div>
    </div>

    <!-- 通用 -->
    <div class="section">
      <div class="section-title">通用</div>
      <div class="menu-list glass">
        <div class="menu-item">
          <div class="ico">🌙</div><span class="label">深色模式</span>
          <div class="toggle on" onclick="toast('深色模式已是当前主题')"></div>
        </div>
        <div class="menu-item" onclick="toast('清除缓存成功')">
          <div class="ico">🧹</div><span class="label">清除缓存</span><span class="sub">12.6 MB</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('关于星愈宇宙 v1.0.0')">
          <div class="ico">ⓘ</div><span class="label">关于星愈宇宙</span><span class="sub">v1.0.0</span><span class="arrow">›</span>
        </div>
      </div>
    </div>

    <!-- 退出登录 -->
    <button class="logout-btn" onclick="logout()">⏻ 退出登录</button>
  </main>

  <script src="js/store.js?v=100"></script>
  <script src="js/app.js?v=204"></script>
  <script>
    StarhealApp.injectBackground();
    StarhealApp.injectTopNav('settings');
    function toast(msg){
      const t=document.createElement('div');
      t.className='toast';t.textContent=msg;
      document.body.appendChild(t);
      setTimeout(()=>t.remove(),2000);
    }
    function logout(){
      if(confirm('确定要退出登录吗？')){
        location.href='login.html';
      }
    }
  </script>
</body>
</html>
