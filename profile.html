<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070f">
  <title>我的 — 星愈·双盲棱镜</title>
  <link rel="stylesheet" href="css/style.css?v=101">
  <style>
    .page{padding-top:72px;padding-bottom:60px;max-width:860px;margin:0 auto}
    .profile-card{display:flex;align-items:center;gap:18px;padding:24px;margin-bottom:18px}
    .profile-card .avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#6b5b95,#4a6fa5);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;box-shadow:0 0 30px rgba(107,91,149,.4)}
    .profile-card .info{flex:1}
    .profile-card .name{font-size:20px;font-weight:600;color:#fff;margin-bottom:6px}
    .profile-card .meta{font-size:13px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
    .profile-card .meta span{display:flex;align-items:center;gap:4px}
    .profile-card .actions{display:flex;gap:8px}
    .icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center}
    .icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
    .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
    .stat-card{padding:18px 12px;text-align:center;border-radius:14px}
    .stat-card .num{font-size:22px;font-weight:600;color:#fff;margin-bottom:4px}
    .stat-card .label{font-size:12px;color:var(--text-dim)}
    .section{margin-bottom:18px}
    .section-title{font-size:13px;color:var(--text-dim);padding:0 8px 10px;letter-spacing:.08em}
    .menu-list{border-radius:14px;overflow:hidden}
    .menu-item{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:all .2s;border-bottom:1px solid rgba(255,255,255,.04)}
    .menu-item:last-child{border-bottom:none}
    .menu-item:hover{background:rgba(255,255,255,.03)}
    .menu-item .ico{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .menu-item .label{flex:1;font-size:14px;color:var(--text-star)}
    .menu-item .arrow{color:var(--text-faint);font-size:14px}
    .menu-item.danger .label{color:#ff8080}
    .menu-item.danger .ico{background:rgba(255,80,80,.08)}
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;background:rgba(20,16,40,.95);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;z-index:999;animation:toastIn .3s}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

    /* ========= 手机端：图一个人中心样式 ========= */
    .mobile-hero{display:none}
    @media(max-width:768px){
      body{overflow-x:hidden}
      /* 隐藏桌面端元素 */
      .profile-card,.stat-row,.section.desktop-only{display:none}
      .page{padding:0;margin:0;max-width:none;min-height:100vh;position:relative;overflow:hidden}
      /* 个人中心大标题 */
      .mobile-hero{
        display:block;
        position:relative;
        min-height:100vh;
        padding:0;
        overflow:hidden;
      }
      .mobile-title{
        position:absolute;
        top:calc(env(safe-area-inset-top,0px) + 60px);
        left:0;right:0;
        text-align:center;
        font-size:42px;
        font-weight:300;
        letter-spacing:.15em;
        color:#eef1ff;
        text-shadow:0 0 30px rgba(138,180,255,.4),0 2px 8px rgba(0,0,0,.6);
        z-index:5;
        font-family:Georgia,"Noto Serif CJK SC",serif;
      }
      /* 右侧大星球 */
      .mobile-planet{
        position:absolute;
        right:-30%;
        top:50%;
        transform:translateY(-50%);
        width:140vw;
        max-width:none;
        aspect-ratio:1;
        z-index:1;
        pointer-events:none;
        background-image:url('planet.png');
        background-size:contain;
        background-repeat:no-repeat;
        background-position:center center;
        filter:drop-shadow(0 0 60px rgba(120,180,220,.35)) drop-shadow(0 0 120px rgba(80,140,200,.25)) blur(1px);
        opacity:.9;
      }
      /* 星球光环 */
      .mobile-planet::after{
        content:'';
        position:absolute;
        top:50%;left:50%;
        width:88%;height:88%;
        transform:translate(-50%,-50%);
        border-radius:50%;
        border:2px solid rgba(150,210,240,.25);
        box-shadow:0 0 40px rgba(120,180,220,.2),inset 0 0 40px rgba(120,180,220,.1);
      }
      /* 扇形卡片容器 */
      .fanned-cards{
        position:absolute;
        bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
        left:0;
        right:0;
        height:360px;
        z-index:6;
        padding:0 20px;
      }
      .fan-card{
        position:absolute;
        bottom:0;
        width:160px;
        height:220px;
        border-radius:20px;
        background:linear-gradient(145deg,rgba(40,60,110,.55),rgba(20,30,60,.65));
        border:1px solid rgba(140,180,255,.22);
        backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);
        box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
        padding:24px 18px;
        display:flex;
        flex-direction:column;
        justify-content:flex-end;
        cursor:pointer;
        transition:transform .3s ease,box-shadow .3s ease;
        color:#eef1ff;
      }
      .fan-card:active{transform:translateY(-4px) scale(1.02)!important}
      .fan-card .fan-title{
        font-size:17px;
        font-weight:500;
        letter-spacing:.05em;
        margin-bottom:6px;
      }
      .fan-card .fan-sub{
        font-size:12px;
        color:rgba(180,200,240,.65);
        letter-spacing:.1em;
      }
      /* 每张卡片的位置与旋转角度 —— 扇形层叠 */
      .fan-card:nth-child(1){left:0;transform:rotate(-12deg) translateY(20px);z-index:1}
      .fan-card:nth-child(2){left:80px;transform:rotate(-4deg) translateY(0);z-index:2}
      .fan-card:nth-child(3){left:170px;transform:rotate(6deg) translateY(-10px);z-index:3}
      .fan-card:nth-child(4){left:250px;transform:rotate(16deg) translateY(5px);z-index:4}
      /* 不同色调 */
      .fan-card.c1{background:linear-gradient(145deg,rgba(100,80,160,.5),rgba(50,40,100,.6))}
      .fan-card.c2{background:linear-gradient(145deg,rgba(80,120,180,.5),rgba(40,70,130,.6))}
      .fan-card.c3{background:linear-gradient(145deg,rgba(60,150,170,.5),rgba(30,90,110,.6))}
      .fan-card.c4{background:linear-gradient(145deg,rgba(150,100,180,.5),rgba(80,50,120,.6))}
      /* 退出登录按钮 —— 手机端固定 */
      .mobile-logout{
        position:absolute;
        top:calc(env(safe-area-inset-top,0px) + 16px);
        right:16px;
        z-index:10;
        width:36px;height:36px;
        border-radius:50%;
        background:rgba(255,255,255,.06);
        border:1px solid rgba(255,255,255,.12);
        color:rgba(255,150,150,.8);
        font-size:16px;
        display:flex;align-items:center;justify-content:center;
        cursor:pointer;
      }
      /* 顶部导航在手机端个人中心隐藏 */
      .topnav,.bottom-nav{display:none}
    }
    @media(max-width:420px){
      .fan-card{width:140px;height:200px}
      .fan-card:nth-child(1){left:0}
      .fan-card:nth-child(2){left:60px}
      .fan-card:nth-child(3){left:130px}
      .fan-card:nth-child(4){left:195px}
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- ========= 手机端：个人中心扇形布局 ========= -->
    <div class="mobile-hero">
      <div class="mobile-title">个人中心</div>
      <div class="mobile-planet"></div>
      <button class="mobile-logout" title="退出登录" onclick="logout()">⏻</button>
      <div class="fanned-cards">
        <div class="fan-card c1" onclick="toast('我的星球功能开发中…')">
          <div class="fan-title">我的星球</div>
          <div class="fan-sub">星球</div>
        </div>
        <div class="fan-card c2" onclick="toast('同频匹配报告功能开发中…')">
          <div class="fan-title">同频匹配报告</div>
          <div class="fan-sub">匹配</div>
        </div>
        <div class="fan-card c3" onclick="toast('共鸣星图功能开发中…')">
          <div class="fan-title">共鸣星图</div>
          <div class="fan-sub">共鸣</div>
        </div>
        <div class="fan-card c4" onclick="toast('我的观点功能开发中…')">
          <div class="fan-title">我的观点</div>
          <div class="fan-sub">观点</div>
        </div>
      </div>
    </div>

    <!-- ========= 桌面端：列表布局 ========= -->
    <div class="profile-card glass">
      <div class="avatar">🌌</div>
      <div class="info">
        <div class="name">星海漫游者</div>
        <div class="meta">
          <span>✦ demo_95gdaj</span>
          <span>· 默认匿名</span>
        </div>
      </div>
      <div class="actions">
        <button class="icon-btn" title="编辑资料" onclick="toast('编辑资料功能开发中…')">✎</button>
        <button class="icon-btn" title="设置" onclick="location.href='settings.html?v=100'">⚙</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card glass"><div class="num">12</div><div class="label">发布观点</div></div>
      <div class="stat-card glass"><div class="num">156</div><div class="label">收到共鸣</div></div>
      <div class="stat-card glass"><div class="num">8</div><div class="label">关注星球</div></div>
      <div class="stat-card glass"><div class="num">34</div><div class="label">收藏</div></div>
    </div>

    <div class="section desktop-only">
      <div class="section-title">账号与内容</div>
      <div class="menu-list glass">
        <div class="menu-item" onclick="toast('我的观点功能开发中…')">
          <div class="ico">✦</div><span class="label">我的观点</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('我的匿名身份功能开发中…')">
          <div class="ico">🎭</div><span class="label">我的匿名身份</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('我的收藏功能开发中…')">
          <div class="ico">★</div><span class="label">我的收藏</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('我的星球功能开发中…')">
          <div class="ico">🪐</div><span class="label">我的星球</span><span class="arrow">›</span>
        </div>
      </div>
    </div>

    <div class="section desktop-only">
      <div class="section-title">双盲棱镜</div>
      <div class="menu-list glass">
        <div class="menu-item" onclick="toast('同频匹配报告功能开发中…')">
          <div class="ico">🔮</div><span class="label">同频匹配报告</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('共鸣星图功能开发中…')">
          <div class="ico">✨</div><span class="label">共鸣星图</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="toast('匿名模式设置功能开发中…')">
          <div class="ico">🕶</div><span class="label">匿名模式设置</span><span class="arrow">›</span>
        </div>
      </div>
    </div>

    <div class="section desktop-only">
      <div class="section-title">设置</div>
      <div class="menu-list glass">
        <div class="menu-item" onclick="location.href='settings.html?v=100'">
          <div class="ico">🔒</div><span class="label">账号与安全</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="location.href='settings.html?v=100'">
          <div class="ico">🔔</div><span class="label">消息通知</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="location.href='settings.html?v=100'">
          <div class="ico">🛡</div><span class="label">隐私设置</span><span class="arrow">›</span>
        </div>
        <div class="menu-item" onclick="location.href='settings.html?v=100'">
          <div class="ico">⚙</div><span class="label">通用设置</span><span class="arrow">›</span>
        </div>
      </div>
    </div>

    <div class="section desktop-only">
      <div class="menu-list glass">
        <div class="menu-item danger" onclick="logout()">
          <div class="ico">⏻</div><span class="label">退出登录</span><span class="arrow">›</span>
        </div>
      </div>
    </div>
  </main>

  <script src="js/store.js?v=101"></script>
  <script src="js/app.js?v=101"></script>
  <script>
    StarhealApp.injectBackground();
    StarhealApp.injectTopNav('profile');
    function toast(msg){
      const t=document.createElement('div');
      t.className='toast';t.textContent=msg;
      document.body.appendChild(t);
      setTimeout(()=>t.remove(),2000);
    }
    function logout(){
      if(confirm('确定要退出登录吗？')){
        location.href='login.html';
      }
    }
  </script>
</body>
</html>
