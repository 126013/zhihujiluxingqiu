<script>
/* ===== 自实现 OrbitControls ===== */
(function(){
  function OrbitControls(camera, domElement){
    this.camera = camera;
    this.domElement = domElement;
    this.target = new THREE.Vector3();
    this.enableDamping = true;
    this.dampingFactor = 0.06;
    this.autoRotate = false;
    this.autoRotateSpeed = 0.35;
    this.minDistance = 5;
    this.maxDistance = 80;
    this.minPolarAngle = 0.05;
    this.maxPolarAngle = Math.PI * 0.95;
    this.enablePan = true;
    this.panSpeed = 0.5;
    this.rotateSpeed = 0.8;
    this.zoomSpeed = 0.8;
    this._spherical = new THREE.Spherical();
    this._sphericalDelta = new THREE.Spherical();
    this._scale = 1;
    this._isDragging = false;
    this._lastX = 0; this._lastY = 0;
    this._isPanning = false;
    this._offset = new THREE.Vector3();
    this._quat = new THREE.Quaternion().setFromUnitVectors(camera.up, new THREE.Vector3(0,1,0));
    this._quatInv = this._quat.clone().invert();

    const self = this;

    this.update = function(){
      const offset = this._offset.copy(this.camera.position).sub(this.target);
      let spherical = this._spherical.setFromVector3(offset);

      if(this.autoRotate && !this._isDragging){
        const theta = 2*Math.PI/60/60 * this.autoRotateSpeed;
        this._sphericalDelta.theta -= theta;
      }

      spherical.theta += this._sphericalDelta.theta;
      spherical.phi += this._sphericalDelta.phi;
      spherical.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, spherical.phi));
      spherical.radius *= this._scale;
      spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, spherical.radius));

      offset.setFromSpherical(spherical);
      this.camera.position.copy(this.target).add(offset);
      this.camera.lookAt(this.target);

      if(this.enableDamping){
        this._sphericalDelta.theta *= (1-this.dampingFactor);
        this._sphericalDelta.phi *= (1-this.dampingFactor);
      }else{
        this._sphericalDelta.set(0,0,0);
      }
      this._scale = 1;
    };

    function getSphericalFromCamera(){
      const o = self._offset.copy(self.camera.position).sub(self.target);
      return self._spherical.setFromVector3(o);
    }
    getSphericalFromCamera();

    function onPointerDown(e){
      self._isDragging = true;
      self._lastX = e.clientX; self._lastY = e.clientY;
      if(e.button===2) self._isPanning = true;
      document.body.classList.add('grabbing');
      e.preventDefault();
    }
    function onPointerMove(e){
      if(!self._isDragging) return;
      const dx = e.clientX - self._lastX;
      const dy = e.clientY - self._lastY;
      self._lastX = e.clientX; self._lastY = e.clientY;
      if(self._isPanning){
        pan(dx, dy);
      }else{
        rotate(dx, dy);
      }
    }
    function onPointerUp(){
      self._isDragging = false;
      self._isPanning = false;
      document.body.classList.remove('grabbing');
    }
    function rotate(dx, dy){
      const el = self.domElement;
      // 拖拽仅控制左右水平方向，垂直方向不响应
      self._sphericalDelta.theta -= 2*Math.PI*dx/el.clientWidth * self.rotateSpeed;
    }
    function pan(dx, dy){
      const el = self.domElement;
      const offset = self._offset.copy(self.camera.position).sub(self.target);
      const targetDistance = offset.length();
      const halfFov = self.camera.fov * Math.PI/180/2;
      const targetHeight = 2 * Math.tan(halfFov) * targetDistance;
      const targetWidth = targetHeight * self.camera.aspect;
      const panX = (dx/el.clientWidth) * targetWidth * self.panSpeed;
      const panY = (dy/el.clientHeight) * targetHeight * self.panSpeed;
      const te = new THREE.Matrix4().makeRotationFromQuaternion(self._quat);
      const xAxis = new THREE.Vector3(1,0,0).applyQuaternion(self._quatInv);
      const yAxis = new THREE.Vector3(0,1,0).applyQuaternion(self._quatInv);
      self.target.add(xAxis.multiplyScalar(-panX)).add(yAxis.multiplyScalar(panY));
    }
    function onWheel(e){
      if(e.deltaY<0) self._scale *= (0.95*self.zoomSpeed);
      else self._scale /= (0.95*self.zoomSpeed);
      e.preventDefault();
    }
    function onContextMenu(e){ e.preventDefault(); }

    domElement.addEventListener('pointerdown', onPointerDown);
    domElement.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    domElement.addEventListener('wheel', onWheel, {passive:false});
    domElement.addEventListener('contextmenu', onContextMenu);

    this.dispose = function(){
      domElement.removeEventListener('pointerdown', onPointerDown);
      domElement.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      domElement.removeEventListener('wheel', onWheel);
      domElement.removeEventListener('contextmenu', onContextMenu);
    };
  }
  if(typeof THREE !== 'undefined') THREE.OrbitControls = OrbitControls;
})();
</script>

<script>
/* ===== Three.js 3D 星系 ===== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050818);
scene.fog = new THREE.FogExp2(0x050818, 0.006);

// 主题切换时同步 3D 背景色
window.addEventListener('themechange', function(e){
  const isLight = e.detail === 'light';
  const bg = isLight ? 0xdde2f0 : 0x050818;
  scene.background = new THREE.Color(bg);
  scene.fog = new THREE.FogExp2(bg, isLight ? 0.004 : 0.006);
});
// 初始化时根据当前主题设置背景
(function syncSceneBg(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    scene.background = new THREE.Color(0xdde2f0);
    scene.fog = new THREE.FogExp2(0xdde2f0, 0.004);
  }
})();

/* 圆形光点纹理 — 让粒子显示为柔和圆点而非方块 */
function makeCircleTexture(){
  const c = document.createElement('canvas'); c.width=c.height=64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,255,255,0.85)');
  g.addColorStop(0.5,'rgba(255,255,255,0.4)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const circleTex = makeCircleTexture();

/* 3D 星空粒子场 — 作为 scene 子对象，独立缓慢旋转 */
const starGroup = new THREE.Group();
(function(){
  const n = 3000;
  const pos = new Float32Array(n*3), col = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r = 80 + Math.random()*400;
    const ta = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(ta);
    pos[i*3+1]=r*Math.sin(ph)*Math.sin(ta);
    pos[i*3+2]=r*Math.cos(ph);
    const c = Math.random();
    if(c<0.6){ col[i*3]=col[i*3+1]=col[i*3+2]=0.9+Math.random()*0.1; }
    else if(c<0.8){ col[i*3]=0.6; col[i*3+1]=0.7; col[i*3+2]=1.0; }
    else{ col[i*3]=0.8; col[i*3+1]=0.7; col[i*3+2]=1.0; }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const m = new THREE.PointsMaterial({size:1.2, map:circleTex, vertexColors:true, transparent:true, opacity:0.8, sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending});
  const stars = new THREE.Points(g, m);
  starGroup.add(stars);

  // 粉紫色星云（作为星空的一部分，一起旋转）
  function makeNebula(color, x, y, scale){
    const nc = document.createElement('canvas'); nc.width=nc.height=512;
    const nctx = nc.getContext('2d');
    const ng = nctx.createRadialGradient(256,256,0,256,256,256);
    ng.addColorStop(0, color.replace('ALPHA','0.25'));
    ng.addColorStop(0.3, color.replace('ALPHA','0.12'));
    ng.addColorStop(0.7, color.replace('ALPHA','0.04'));
    ng.addColorStop(1, color.replace('ALPHA','0'));
    nctx.fillStyle = ng; nctx.fillRect(0,0,512,512);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(nc), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
    spr.position.set(x, y, -200);
    spr.scale.set(scale, scale, 1);
    return spr;
  }
  starGroup.add(makeNebula('rgba(200,140,220,ALPHA)', -180, 40, 220));
  starGroup.add(makeNebula('rgba(160,120,230,ALPHA)', 180, -30, 200));
  starGroup.add(makeNebula('rgba(120,160,230,ALPHA)', 0, 120, 180));

  scene.add(starGroup);
  scene.add(camera);
})();

    fragmentShader: `uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uRimColor; uniform float uTime;
      varying vec3 vLocalPos; varying vec3 vNormal;
      float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
      float noise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.0-2.0*f);
        float n=mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),

      float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.02;a*=0.5;}return v;}

/* 行星程序化 Shader — 渐变 + 云层 + 城市光点 + Fresnel 边缘辉光 */
const planetVert = `
  varying vec3 vLocalPos;
  varying vec3 vNormal;
  varying vec3 vViewDir;
  void main(){
    vLocalPos = position;
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPos = viewMatrix * modelMatrix * vec4(position, 1.0);
    vViewDir = normalize(-mvPos.xyz);
    gl_Position = projectionMatrix * mvPos;
  }
`;
const planetFrag = `
  uniform vec3 uColorA;
  uniform vec3 uColorB;
  uniform vec3 uRimColor;
  varying vec3 vLocalPos;
  varying vec3 vNormal;
  varying vec3 vViewDir;
  vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return fract(sin(p)*43758.5453123);}
  float noise3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float n000=dot(hash3(i+vec3(0,0,0))-0.5,f-vec3(0,0,0));float n100=dot(hash3(i+vec3(1,0,0))-0.5,f-vec3(1,0,0));float n010=dot(hash3(i+vec3(0,1,0))-0.5,f-vec3(0,1,0));float n110=dot(hash3(i+vec3(1,1,0))-0.5,f-vec3(1,1,0));float n001=dot(hash3(i+vec3(0,0,1))-0.5,f-vec3(0,0,1));float n101=dot(hash3(i+vec3(1,0,1))-0.5,f-vec3(1,0,1));float n011=dot(hash3(i+vec3(0,1,1))-0.5,f-vec3(0,1,1));float n111=dot(hash3(i+vec3(1,1,1))-0.5,f-vec3(1,1,1));float nx00=mix(n000,n100,f.x),nx10=mix(n010,n110,f.x),nx01=mix(n001,n101,f.x),nx11=mix(n011,n111,f.x);float nxy0=mix(nx00,nx10,f.y),nxy1=mix(nx01,nx11,f.y);return mix(nxy0,nxy1,f.z)*2.0;}
  float fbm(vec3 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise3(p);p*=2.02;a*=0.5;}return v;}
  void main(){
    vec3 N=normalize(vNormal),V=normalize(vViewDir);
    vec3 pos=normalize(vLocalPos);
    float cloudLow=fbm(pos*1.5), cloudMid=fbm(pos*3.0);
    float t=pos.x*0.5+0.5+cloudLow*0.15;
    t=clamp(t,0.0,1.0);
    vec3 col=mix(uColorA,uColorB,t);
    float cloudMask=smoothstep(0.1,0.55,cloudLow);
    vec3 cloudCol=mix(vec3(1.0,0.96,0.9),vec3(1.0,0.9,0.82),cloudMid*0.5+0.5);
    col=mix(col,cloudCol,cloudMask*0.45);
    float darkCloud=smoothstep(0.0,-0.35,cloudMid*1.2);
    col=mix(col,col*0.5,darkCloud*0.4);
    float cityNoise=fbm(pos*9.0);
    float cityMask=smoothstep(0.52,0.66,cityNoise)*smoothstep(0.1,0.6,t);
    vec3 cityColor=mix(vec3(1.0,0.96,0.75),vec3(1.0,0.82,0.5),cityNoise);
    col+=cityColor*cityMask*1.8;
    float fresnel=pow(1.0-max(dot(N,V),0.0),2.5);
    col+=uRimColor*fresnel*1.0;
    col+=noise3(pos*70.0)*0.02;
    gl_FragColor=vec4(col,1.0);
  }
`;
function makePlanetMaterial(colorA, colorB, rimColor){
  return new THREE.ShaderMaterial({
    uniforms:{
      uColorA:{value:new THREE.Color(colorA)},
      uColorB:{value:new THREE.Color(colorB)},
      uRimColor:{value:new THREE.Color(rimColor)}
    },
    vertexShader:planetVert,
    fragmentShader:planetFrag
  });
}

/* 创建 7 个公转小星球（一次性，不随切换重建） */
function buildSatellites(){
  bigPlanets.forEach(function(bp, idx){
    const p = {
      size: 1.0 + (idx%3)*0.12,
      ring: idx%2===1,
      a: 6.5 + idx*1.8,
      b: 2.2 + idx*0.6,
      tiltX: (idx%2===0?1:-1) * (0.12 + (idx%4)*0.07),
      tiltY: ((idx%5)-2) * 0.06,
      speed: 0.20 - idx*0.016,
      offset: idx * 0.85
    };

    const group = new THREE.Group();
    const mat = makeSatMaterial(bp.colorA, bp.colorB, bp.rim);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), mat);
    group.add(mesh);

    // 星环
    if(p.ring){
      const ringGeo = new THREE.RingGeometry(p.size*1.5, p.size*2.2, 64);
      const ringMat = new THREE.MeshBasicMaterial({color:bp.color, transparent:true, opacity:0.35, side:THREE.DoubleSide, depthWrite:false});
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI/2 - 0.3;
      group.add(ring);
    }

    // 辉光
    const col = new THREE.Color(bp.color);
    const gc = document.createElement('canvas'); gc.width=gc.height=128;
    const g = gc.getContext('2d');
    const gg = g.createRadialGradient(64,64,0,64,64,64);
    gg.addColorStop(0,'rgba('+Math.round(col.r*255)+','+Math.round(col.g*255)+','+Math.round(col.b*255)+',0.6)');
    gg.addColorStop(0.4,'rgba('+Math.round(col.r*255)+','+Math.round(col.g*255)+','+Math.round(col.b*255)+',0.2)');
    gg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gg; g.fillRect(0,0,128,128);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
    glow.scale.set(p.size*5, p.size*5, 1);
    group.add(glow);

    scene.add(group);

    // 标签
    const labelEl = document.createElement('div');
    labelEl.className = 'label-el';
    labelEl.textContent = bp.name;
    document.body.appendChild(labelEl);

    satellites.push({
      group, planet:mesh, labelEl, material:mat,
      orbitA:p.a, orbitB:p.b, tiltX:p.tiltX, tiltY:p.tiltY,
      angleOffset:p.offset, speed:p.speed, rotationSpeed:0.3,
      name:bp.name, size:p.size, color:'#'+bp.color.toString(16).padStart(6,'0'),
      bigIdx:idx
    });

    // 椭圆轨道线
    const curve = new THREE.EllipseCurve(0, 0, p.a, p.b, 0, Math.PI*2, false, 0);
    const pts = curve.getPoints(128);
    const geo = new THREE.BufferGeometry().setFromPoints(pts.map(function(pt){return new THREE.Vector3(pt.x, pt.y, 0);}));
    const lineMat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.15});
    const line = new THREE.Line(geo, lineMat);
    line.rotation.x = p.tiltX; line.rotation.y = p.tiltY;
    scene.add(line);
    orbitLines.push(line);
  });
}

/* 渲染左侧大星球列表 */
function buildSidebar(){
  planetList.innerHTML = '';
  bigPlanets.forEach(function(bp, idx){
    const col = '#'+bp.color.toString(16).padStart(6,'0');
    const item = document.createElement('div');
    item.className = 'planet-item' + (idx===currentBigIndex?' active':'');
    item.dataset.bigIdx = idx;
    item.innerHTML = '<div class="planet-dot" style="background:'+col+';color:'+col+';box-shadow:0 0 10px '+col+';"></div><div class="planet-name">'+bp.name+'</div>';
    item.onclick = function(){ selectBigPlanet(idx); };
    planetList.appendChild(item);
  });
}

/* 点击左侧大星球 → 镜头放大到对应公转小星球 + 显示该大星球的小星球面板 */
function selectBigPlanet(idx){
  currentBigIndex = idx;
  buildSidebar();
  const sat = satellites.find(function(s){return s.bigIdx===idx;});
  if(sat){ focusOnSatellite(sat); }
  showBigPlanetPanel(bigPlanets[idx]);
}

function resetCamera(){
  if(focusAnim){ cancelAnimationFrame(focusAnim); focusAnim=null; }
  focusedSat = null;
  focusLocked = true;
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const toPos = new THREE.Vector3(0, 2, 32);
  const toTarget = new THREE.Vector3(0, 0, 0);
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now-start)/800);
    const e = t<0.5?2*t*t:-1+(4-2*t)*t;
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    if(t<1){
      requestAnimationFrame(tick);
    }else{
      focusLocked = false;
    }
  }
  requestAnimationFrame(tick);
}

buildSidebar();
buildSatellites();

/* 螺旋星系粒子带 */
let galaxyParticles;
(function(){
  const n = 4000;
  const pos = new Float32Array(n*3), col = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const arm = i % 3;
    const angle = (i/n) * Math.PI * 8 + arm * (Math.PI*2/3);
    const radius = 3 + (i/n) * 14;
    const spread = (Math.random()-0.5) * 2.5;
    const x = Math.cos(angle) * radius + spread * Math.cos(angle+Math.PI/2);
    const z = Math.sin(angle) * radius + spread * Math.sin(angle+Math.PI/2);
    const y = (Math.random()-0.5) * 1.2;
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    const c = Math.random();
    if(c<0.5){ col[i*3]=col[i*3+1]=col[i*3+2]=0.6+Math.random()*0.4; }
    else if(c<0.8){ col[i*3]=0.5; col[i*3+1]=0.6; col[i*3+2]=1.0; }
    else{ col[i*3]=0.7; col[i*3+1]=0.5; col[i*3+2]=1.0; }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const m = new THREE.PointsMaterial({size:0.3, map:circleTex, vertexColors:true, transparent:true, opacity:0.85, sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending});
  galaxyParticles = new THREE.Points(g, m);
  scene.add(galaxyParticles);
})();

/* 射线拾取 */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('click', function(e){
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(ndc, camera);
  const meshes = [starMesh].concat(satellites.map(function(s){return s.planet;}));
  const hits = raycaster.intersectObjects(meshes, false);
  if(hits.length>0){
    if(hits[0].object.userData.isCentral){
      // 点击中心恒星（推荐广场）→ 跳转推荐广场
      location.href='community.html?v=10';
      return;
    }
    const sat = satellites.find(function(s){return s.planet===hits[0].object;});
    if(sat){
      // 点击公转小星球 → 放大 + 显示该大星球面板
      currentBigIndex = sat.bigIdx;
      buildSidebar();
      focusOnSatellite(sat);
      showBigPlanetPanel(bigPlanets[sat.bigIdx]);
    }
  }
});

let focusedSat = null;
let focusAnim = null;
let focusLocked = false; // focus 动画进行中，跳过 animate 里的 controls 操作
function focusOnSatellite(sat){
  focusedSat = sat;
  focusLocked = true;
  if(focusAnim) cancelAnimationFrame(focusAnim);
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const start = performance.now();
  const duration = 900;
  function tick(now){
    const t = Math.min(1, (now-start)/duration);
    const e = t<0.5?2*t*t:-1+(4-2*t)*t;
    // 跟随卫星当前位置（卫星在公转，镜头需要追上它）
    // offset 距离 sqrt(4+110.25)≈10.7 > minDistance(10)，避免 update() 弹回
    const satPos = sat.group.position.clone();
    const targetPos = satPos.clone().add(new THREE.Vector3(0, 2.0, 10.5));
    camera.position.lerpVectors(fromPos, targetPos, e);
    controls.target.lerpVectors(fromTarget, satPos, e);
    if(t<1){
      focusAnim = requestAnimationFrame(tick);
    }else{
      focusLocked = false;
    }
  }
  focusAnim = requestAnimationFrame(tick);
}

/* 详情面板 */
const uiOverlay = document.getElementById('uiOverlay');
const detailPanel = document.getElementById('detailPanel');
const escBtn = document.getElementById('escBtn');

function showBigPlanetPanel(bp){
  // 侧栏高亮当前大星球
  document.querySelectorAll('.planet-item').forEach(function(i){i.classList.remove('active');});
  const items = document.querySelectorAll('.planet-item');
  if(items[currentBigIndex]) items[currentBigIndex].classList.add('active');

  const col = '#'+bp.color.toString(16).padStart(6,'0');
  // 小星球选项列表
  const subOptions = bp.subs.map(function(s){
    const sel = s.name===selectedSubName ? ' selected' : '';
    return '<div class="sub-option'+sel+'" data-name="'+s.name+'">'+
             '<div class="sub-option__dot" style="background:'+col+';"></div>'+
             '<div class="sub-option__name">'+s.name+'</div>'+
           '</div>';
  }).join('');

  detailPanel.innerHTML =
    '<div class="detail-card">'+
      '<div class="detail-top">'+
        '<div class="detail-sprite" style="background:radial-gradient(circle at 30% 30%,'+col+'99, '+col+'33, transparent);"></div>'+
        '<div><div class="detail-name">'+bp.name+'</div><div class="detail-tag">'+bp.style+'</div></div>'+
      '</div>'+
      '<div class="detail-desc">选择代表图层（小星球），点击「进入社区」探索。</div>'+
      '<div class="detail-subs">'+subOptions+'</div>'+
      '<div class="detail-tags">'+
        bp.style.split(' · ').map(function(t){return '<div class="detail-chip">'+t+'</div>';}).join('')+
      '</div>'+
      '<div class="detail-actions">'+
        '<button class="detail-btn primary" id="ec">进入社区</button>'+
        '<button class="detail-btn" id="cp">关闭</button>'+
      '</div>'+
    '</div>';

  // 小星球选项点击
  detailPanel.querySelectorAll('.sub-option').forEach(function(opt){
    opt.addEventListener('click', function(){
      selectedSubName = opt.dataset.name;
      detailPanel.querySelectorAll('.sub-option').forEach(function(o){o.classList.remove('selected');});
      opt.classList.add('selected');
    });
  });

  document.getElementById('ec').onclick = function(){
    if(selectedSubName){
      location.href='community.html?v=11&big='+encodeURIComponent(bp.name)+'&planet='+encodeURIComponent(selectedSubName);
    }
  };
  document.getElementById('cp').onclick = closeDetailPanel;
  uiOverlay.classList.add('panel-open');
  const toast = document.getElementById('discoverToast');
  toast.textContent = '✦ ' + bp.name;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){toast.classList.remove('show');}, 2500);
}
function closeDetailPanel(){
  uiOverlay.classList.remove('panel-open');
  document.querySelectorAll('.planet-item').forEach(function(i){i.classList.remove('active');});
}
escBtn.onclick = closeDetailPanel;
// 推荐广场入口 — 直接跳转到推荐广场社区
document.getElementById('plazaEntry').addEventListener('click', function(){
  location.href='community.html?v=10';
});

/* ========== 顶部搜索框 ========== */
// 收集所有可搜索社区（推荐广场 + 七大方向下的所有代表图层）
const searchableCommunities = [{name:'推荐广场', color:'#ffffff', big:''}];
bigPlanets.forEach(function(bp){
  bp.subs.forEach(function(s){
    searchableCommunities.push({name:s.name, color:'#'+bp.color.toString(16).padStart(6,'0'), big:bp.name});
  });
});

const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchSuggest = document.getElementById('searchSuggest');

function renderSuggest(keyword){
  const kw = (keyword||'').trim().toLowerCase();
  let list = searchableCommunities;
  if(kw){ list = list.filter(function(c){return c.name.toLowerCase().includes(kw);}); }
  searchSuggest.innerHTML = '';
  if(list.length === 0){
    searchSuggest.innerHTML = '<div class="suggest-empty">未找到匹配的社区</div>';
  } else {
    list.forEach(function(c){
      const item = document.createElement('div');
      item.className = 'suggest-item';
      item.innerHTML = '<span class="s-dot" style="background:'+c.color+';box-shadow:0 0 6px '+c.color+';"></span><span>'+c.name+'</span>';
      item.onclick = function(){ goToCommunity(c.name, c.big); };
      searchSuggest.appendChild(item);
    });
  }
  searchBar.classList.add('show-suggest');
}

function goToCommunity(name, big){
  if(!name || !name.trim()) return;
  let url = 'community.html?v=10&planet=' + encodeURIComponent(name.trim());
  if(big) url += '&big=' + encodeURIComponent(big);
  location.href = url;
}

searchInput.addEventListener('input', function(){ renderSuggest(this.value); });
searchInput.addEventListener('focus', function(){ renderSuggest(this.value); });
searchInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); doSearch(); }
});
searchBtn.addEventListener('click', function(){ doSearch(); });

function doSearch(){
  const val = searchInput.value.trim();
  if(!val) return;
  // 优先精确匹配，带上 big
  const exact = searchableCommunities.find(function(c){ return c.name === val; });
  if(exact){ goToCommunity(exact.name, exact.big); return; }
  // 否则取第一个匹配项
  const kw = val.toLowerCase();
  const hit = searchableCommunities.find(function(c){ return c.name.toLowerCase().includes(kw); });
  if(hit){ goToCommunity(hit.name, hit.big); return; }
  goToCommunity(val, '');
}

// 点击搜索框外部关闭建议下拉
document.addEventListener('click', function(e){
  if(!searchBar.contains(e.target)){ searchBar.classList.remove('show-suggest'); }
});

document.addEventListener('keydown', function(e){ if(e.key==='Escape' && uiOverlay.classList.contains('panel-open')) closeDetailPanel(); });

// 点击"爱好星球"标题 — 关闭详情面板并重置相机到全星系视图
document.querySelector('.cosmos-title').addEventListener('click', function(){
  closeDetailPanel();
  resetCamera();
});

document.querySelectorAll('.cosmos-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.cosmos-tab').forEach(function(t){t.classList.remove('active');});
    tab.classList.add('active');
    const k = tab.dataset.tab;
    if(k==='prism') location.href='prism.html?v=9';
    else if(k==='me') location.href='profile.html?v=9';
  });
});

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function updateLabels(){
  const w = window.innerWidth, h = window.innerHeight;
  // 中心恒星标签 — 推荐广场
  projV.copy(centralGroup.position);
  projV.project(camera);
  const cx = (projV.x * 0.5 + 0.5) * w;
  const cy = (-projV.y * 0.5 + 0.5) * h;
  centralLabel.style.left = cx + 'px';
  centralLabel.style.top = (cy - 70) + 'px';
  centralLabel.style.opacity = projV.z > 1 ? 0.2 : 1;
  centralLabel.style.transform = 'translate(-50%,-100%)';

  satellites.forEach(function(sat){
    projV.copy(sat.group.position);
    projV.project(camera);
    const x = (projV.x * 0.5 + 0.5) * w;
    const y = (-projV.y * 0.5 + 0.5) * h;
    const behind = projV.z > 1;
    const scale = Math.max(0.3, 1 - projV.z * 0.3);
    sat.labelEl.style.left = x + 'px';
    sat.labelEl.style.top = (y - sat.size*10*scale - 4) + 'px';
    sat.labelEl.style.opacity = behind ? 0.15 : Math.min(1, 0.3 + scale * 0.7);
    sat.labelEl.style.transform = 'translate(-50%,-100%) scale(' + scale + ')';
  });
}
let sphereAngle = 0; // 累积自转角度，避免速度切换时跳变
let lastTime = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  const t = now / 1000;

  // 中心恒星自转
  const baseSpeed = 0.3;
  sphereAngle += dt * baseSpeed;
  starMesh.rotation.y = sphereAngle;
  starUniforms.uTime.value = t;

  // 星空背景缓慢反向旋转
  starGroup.rotation.y -= dt * 0.0096;

  // 螺旋星系粒子带缓慢旋转
  if(galaxyParticles) galaxyParticles.rotation.y += dt * 0.02;

  const pulse = 0.7 + Math.sin(t * 0.8) * 0.15;
  glow1.material.opacity = pulse;
  glow2.material.opacity = pulse * 0.5;

  // 卫星 3D 椭圆公转 + 自转 + 材质 uTime 更新
  satellites.forEach(function(sat){
    const theta = sat.angleOffset + t * sat.speed;
    const x0 = Math.cos(theta) * sat.orbitA;
    const y0 = Math.sin(theta) * sat.orbitB;
    const x1 = x0*Math.cos(sat.tiltY) - y0*Math.sin(sat.tiltX)*Math.sin(sat.tiltY);
    const y1 = x0*Math.sin(sat.tiltY) + y0*Math.sin(sat.tiltX)*Math.cos(sat.tiltY);
    const z1 = y0*Math.cos(sat.tiltX);
    sat.group.position.set(x1, y1, z1);
    sat.planet.rotation.y = t * sat.rotationSpeed;
    sat.planet.rotation.x = t * sat.rotationSpeed * 0.3;
    if(sat.material && sat.material.uniforms.uTime){
      sat.material.uniforms.uTime.value = t;
    }
  });

  // focus 动画进行中时跳过 controls 操作，避免冲突导致闪屏
  if(!focusLocked){
    controls._sphericalDelta.set(0, 0, 0); // 每帧强制清零，彻底停止相机运动
    controls.update();
  }
  updateLabels();
  renderer.render(scene, camera);
}

setTimeout(function(){
  document.getElementById('loading').classList.add('hide');
  animate();
}, 300);
</script>
